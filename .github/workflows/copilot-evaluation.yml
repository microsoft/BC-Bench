name: Evaluation with GitHub Copilot
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Copilot model to use for evaluation"
        required: false
        default: "gpt-5.6-luna"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-opus-5"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.3-codex"
          - "mai-code-1-flash-picker"
          - "gemini-3.6-flash"
      category:
        description: "Evaluation category to run"
        required: false
        default: "bug-fix"
        type: choice
        options:
          - "bug-fix"
          - "test-generation"
          - "code-review"
          - "extensibility-request-implement"
          - "extensibility-request-triage"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      al-mcp:
        description: "Enable AL MCP server"
        required: false
        default: false
        type: boolean
      al-lsp:
        description: "Enable AL LSP server"
        required: false
        default: false
        type: boolean
      repeat:
        description: "Number of times to run sequentially (ignored for test runs)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      git-ref:
        description: "Branch to record for experiment tracking (auto-filled on requeue; leave blank for manual runs)"
        required: false
        default: ""
        type: string
      troubleshoot-requeue:
        description: "Fast requeue permissions/ref-creation diagnostic that skips evaluation. To run the PR version, dispatch this existing workflow on the PR branch/ref with this enabled."
        required: false
        default: false
        type: boolean

concurrency:
  group: copilot-evaluation-${{ inputs.test-run && 'test' || 'full' }}-${{ inputs.category }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  get-entries:
    if: ${{ !inputs.troubleshoot-requeue }}
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run }}
      category: ${{ inputs.category }}

  evaluate-with-copilot-cli:
    runs-on: ${{ needs.get-entries.outputs.runner }}
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: ${{ !inputs.troubleshoot-requeue && needs.get-entries.outputs.entries != '[]' }}
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup BC Container and Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: ${{ inputs.category }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-container: ${{ needs.get-entries.outputs.requires-container != 'true' }}
          skip-repo: ${{ needs.get-entries.outputs.requires-repo != 'true' }}

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install AL Tool
        if: ${{ inputs.al-mcp || inputs.al-lsp }}
        shell: pwsh
        run: |
          dotnet tool install -g Microsoft.Dynamics.BusinessCentral.Development.Tools --version 18.0.37.11445-beta
          echo "$HOME\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Install evaluation CLIs
        uses: $/.github/actions/install-eval-clis

      - name: Run GitHub Copilot CLI for entry ${{ matrix.entry }}
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run bcbench evaluate copilot "${{ matrix.entry }}" `
            --model "${{ inputs.model }}" `
            --category "${{ inputs.category }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}" `
            ${{ inputs.al-mcp && '--al-mcp' || '' }} `
            ${{ inputs.al-lsp && '--al-lsp' || '' }}

      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-copilot-cli
    if: ${{ !inputs.troubleshoot-requeue }}
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-copilot-cli.outputs.results-dir }}
      model: ${{ inputs.model }}
      agent: "GitHub Copilot CLI"
      mock: ${{ inputs.test-run }}
      category: ${{ inputs.category }}
      git-ref: ${{ inputs.git-ref || github.ref_name }}
    secrets: inherit

  requeue:
    needs: summarize-results
    if: ${{ !inputs.troubleshoot-requeue && !inputs.test-run }}
    uses: $/.github/workflows/requeue-evaluation.yml
    permissions:
      contents: write
      actions: write
    with:
      workflow-file: copilot-evaluation.yml
      repeat: ${{ inputs.repeat }}
      workflow-inputs: |
        {"model": "${{ inputs.model }}", "category": "${{ inputs.category }}", "test-run": "${{ inputs.test-run }}", "al-mcp": "${{ inputs.al-mcp }}", "al-lsp": "${{ inputs.al-lsp }}", "git-ref": "${{ inputs.git-ref || github.ref_name }}"}

  troubleshoot-requeue:
    if: ${{ inputs.troubleshoot-requeue }}
    name: Troubleshoot requeue permissions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Probe token permissions and ref creation
        shell: bash
        run: |
          set +e

          api_url="https://api.github.com"
          generic_tag="actions-permission-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          eval_tag="eval-run-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="actions-permission-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          declare -A status

          request() {
            local name="$1"
            local method="$2"
            local path="$3"
            local body="${RUNNER_TEMP}/requeue-probe-${name}.json"
            local response_status
            local -a args=(
              --silent
              --show-error
              --output "${body}"
              --write-out "%{http_code}"
              --request "${method}"
              --header "Accept: application/vnd.github+json"
              --oauth2-bearer "${GH_TOKEN}"
              --header "X-GitHub-Api-Version: 2022-11-28"
            )

            if [[ $# -eq 4 ]]; then
              args+=(--header "Content-Type: application/json" --data "$4")
            fi

            response_status="$(curl "${args[@]}" "${api_url}/${path}")"
            status["${name}"]="${response_status:-000}"
          }

          request repo-read GET "repos/${REPOSITORY}"
          request blob-create POST "repos/${REPOSITORY}/git/blobs" \
            "$(jq -nc --arg content "requeue probe ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" '{content: $content, encoding: "utf-8"}')"
          request generic-tag POST "repos/${REPOSITORY}/git/refs" \
            "$(jq -nc --arg ref "refs/tags/${generic_tag}" --arg sha "${TARGET_SHA}" '{ref: $ref, sha: $sha}')"
          request eval-tag POST "repos/${REPOSITORY}/git/refs" \
            "$(jq -nc --arg ref "refs/tags/${eval_tag}" --arg sha "${TARGET_SHA}" '{ref: $ref, sha: $sha}')"
          request branch POST "repos/${REPOSITORY}/git/refs" \
            "$(jq -nc --arg ref "refs/heads/${branch}" --arg sha "${TARGET_SHA}" '{ref: $ref, sha: $sha}')"
          request rulesets GET "repos/${REPOSITORY}/rulesets"
          request actions-permissions GET "repos/${REPOSITORY}/actions/permissions/workflow"

          {
            echo "REQUEUE_PROBE_REPO_READ_STATUS=${status[repo-read]}"
            echo "REQUEUE_PROBE_BLOB_STATUS=${status[blob-create]}"
            echo "REQUEUE_PROBE_GENERIC_TAG_STATUS=${status[generic-tag]}"
            echo "REQUEUE_PROBE_EVAL_TAG_STATUS=${status[eval-tag]}"
            echo "REQUEUE_PROBE_BRANCH_STATUS=${status[branch]}"
            echo "REQUEUE_PROBE_RULESETS_STATUS=${status[rulesets]}"
            echo "REQUEUE_PROBE_ACTIONS_PERMISSIONS_STATUS=${status[actions-permissions]}"
            [[ "${status[generic-tag]}" == "201" ]] && echo "REQUEUE_PROBE_GENERIC_TAG=${generic_tag}"
            [[ "${status[eval-tag]}" == "201" ]] && echo "REQUEUE_PROBE_EVAL_TAG=${eval_tag}"
            [[ "${status[branch]}" == "201" ]] && echo "REQUEUE_PROBE_BRANCH=${branch}"
          } >> "${GITHUB_ENV}"

      - name: Write diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Requeue permissions diagnostic"
            echo
            echo "| Operation | HTTP status | Interpretation |"
            echo "| --- | --- | --- |"
            echo "| Authenticated repository read | \`${REQUEUE_PROBE_REPO_READ_STATUS}\` | Verifies that the workflow token can read this repository. |"
            echo "| Unreachable Git blob creation | \`${REQUEUE_PROBE_BLOB_STATUS}\` | Tests effective Git contents write without modifying a ref. |"
            echo "| Generic temporary tag | \`${REQUEUE_PROBE_GENERIC_TAG_STATUS}\` | Tests general tag-ref creation. |"
            echo "| Production-like \`eval-run-*\` tag | \`${REQUEUE_PROBE_EVAL_TAG_STATUS}\` | Tests the namespace used by requeue. |"
            echo "| Temporary diagnostic branch | \`${REQUEUE_PROBE_BRANCH_STATUS}\` | Distinguishes tag-only restrictions from broad ref restrictions. |"
            echo "| Repository rulesets (best effort) | \`${REQUEUE_PROBE_RULESETS_STATUS}\` | Access may require additional privileges. |"
            echo "| Actions permission metadata (best effort) | \`${REQUEUE_PROBE_ACTIONS_PERMISSIONS_STATUS}\` | Access may require additional privileges. |"
            echo

            if [[ "${REQUEUE_PROBE_BLOB_STATUS}" == "403" ]]; then
              echo "- Blob creation returned 403: the token lacks effective contents write, or an organization/enterprise policy restricts it."
            fi
            if [[ "${REQUEUE_PROBE_BLOB_STATUS}" == "201" && "${REQUEUE_PROBE_GENERIC_TAG_STATUS}" != "201" && "${REQUEUE_PROBE_EVAL_TAG_STATUS}" != "201" && "${REQUEUE_PROBE_BRANCH_STATUS}" != "201" ]]; then
              echo "- Blob creation succeeded but all ref creation failed: repository rules or rulesets likely restrict ref creation."
            fi
            if [[ "${REQUEUE_PROBE_GENERIC_TAG_STATUS}" == "201" && "${REQUEUE_PROBE_EVAL_TAG_STATUS}" != "201" ]]; then
              echo "- The generic tag succeeded but the eval-run tag failed: a namespace-specific tag ruleset likely applies."
            fi
            if [[ "${REQUEUE_PROBE_GENERIC_TAG_STATUS}" != "201" && "${REQUEUE_PROBE_EVAL_TAG_STATUS}" != "201" && "${REQUEUE_PROBE_BRANCH_STATUS}" == "201" ]]; then
              echo "- Tag refs failed but the branch ref succeeded: a tag-specific restriction likely applies."
            fi
            if [[ "${REQUEUE_PROBE_EVAL_TAG_STATUS}" == "201" ]]; then
              echo "- Production-like ref creation succeeded: the original failure may have been transient or context-specific."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete temporary refs
        if: always()
        shell: bash
        run: |
          delete_ref() {
            local ref="$1"
            curl --silent --show-error --output /dev/null --write-out "Deleted ${ref}: HTTP %{http_code}\n" \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --oauth2-bearer "${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/${ref}" || true
          }

          [[ -n "${REQUEUE_PROBE_GENERIC_TAG:-}" ]] && delete_ref "tags/${REQUEUE_PROBE_GENERIC_TAG}"
          [[ -n "${REQUEUE_PROBE_EVAL_TAG:-}" ]] && delete_ref "tags/${REQUEUE_PROBE_EVAL_TAG}"
          [[ -n "${REQUEUE_PROBE_BRANCH:-}" ]] && delete_ref "heads/${REQUEUE_PROBE_BRANCH}"

      - name: Fail when production-like tag creation failed
        if: always()
        shell: bash
        run: |
          if [[ "${REQUEUE_PROBE_EVAL_TAG_STATUS}" != "201" ]]; then
            echo "Production-like eval-run tag creation failed; see the diagnostic summary."
            exit 1
          fi
