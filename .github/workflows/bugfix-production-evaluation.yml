name: Opt-in production bug-fix evaluation

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent harness
        type: choice
        options: [copilot, claude]
        default: copilot
        required: true
      model:
        description: Model ID from the selected harness registry
        type: string
        default: claude-sonnet-5
        required: true
      test-run:
        description: Evaluate four sampled canary entries rather than the full dataset
        type: boolean
        default: true
      canary-entries:
        description: Optional JSON array of exactly five distinct bug-fix entry IDs; overrides the evaluation matrix
        type: string
        required: false
        default: ""
      al-mcp:
        description: Enable evaluator-owned AL MCP
        type: boolean
        default: false
      al-lsp:
        description: Enable restricted AL LSP
        type: boolean
        default: false
      bc-mcp:
        description: Enable BC MCP gateway
        type: boolean
        default: false
      rehearsal:
        description: Require ten checkpoint restore rehearsals on each of the two canary entries before evaluation
        type: boolean
        default: false
      rehearsal-only:
        description: Run checkpoint rehearsals without launching an agent or summarizing results
        type: boolean
        default: false
  workflow_call:
    inputs:
      agent:
        description: Agent harness
        type: string
        default: copilot
        required: true
      model:
        description: Model ID from the selected harness registry
        type: string
        default: claude-sonnet-5
        required: true
      test-run:
        description: Evaluate four sampled canary entries rather than the full dataset
        type: boolean
        default: true
      canary-entries:
        description: Optional JSON array of exactly five distinct bug-fix entry IDs; overrides the evaluation matrix
        type: string
        default: ""
      al-mcp:
        description: Enable evaluator-owned AL MCP
        type: boolean
        default: false
      al-lsp:
        description: Enable restricted AL LSP
        type: boolean
        default: false
      bc-mcp:
        description: Enable BC MCP gateway
        type: boolean
        default: false
      rehearsal:
        description: Require ten checkpoint restore rehearsals on each of the two canary entries before evaluation
        type: boolean
        default: false
      rehearsal-only:
        description: Run checkpoint rehearsals without launching an agent or summarizing results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bugfix-production-evaluation
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-python-uv
      - name: Validate dispatch before provisioning or paid agent execution
        id: validate
        shell: pwsh
        env:
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os
          from typing import get_args
          from bcbench.cli_options import CopilotModel, ClaudeCodeModel
          registries = {"copilot": CopilotModel, "claude": ClaudeCodeModel}
          annotation = registries.get(os.environ["AGENT"])
          if annotation is None or os.environ["MODEL"] not in get_args(get_args(annotation)[0]):
              raise SystemExit("Model must belong to the selected agent harness.")
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { throw "Invalid agent/model selection." }

  get-entries:
    needs: validate
    uses: $/.github/workflows/get-entries.yml
    with:
      category: bug-fix
      test-run: ${{ inputs.canary-entries == '' && inputs.test-run }}

  select-entries:
    needs: get-entries
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.select.outputs.entries }}
    steps:
      - name: Validate explicit canary selection before any provisioning
        id: select
        shell: python {0}
        env:
          ENTRIES: ${{ needs.get-entries.outputs.entries }}
          CANARY_ENTRIES: ${{ inputs.canary-entries }}
        run: |
          import json
          import os
          entries = json.loads(os.environ["ENTRIES"])
          if not isinstance(entries, list) or not all(isinstance(entry, str) and entry.strip() for entry in entries):
              raise SystemExit("Expected a JSON array of bug-fix dataset entry IDs.")
          requested = os.environ["CANARY_ENTRIES"]
          if requested:
              try:
                  selected = json.loads(requested)
              except json.JSONDecodeError as error:
                  raise SystemExit("canary-entries must be a JSON array of exactly five distinct bug-fix entry IDs.") from error
              if not isinstance(selected, list) or len(selected) != 5 or not all(isinstance(entry, str) and entry.strip() for entry in selected) or len(set(selected)) != 5:
                  raise SystemExit("canary-entries must contain exactly five distinct bug-fix entry IDs.")
              if not set(selected).issubset(entries):
                  raise SystemExit("canary-entries contains unknown bug-fix entry IDs.")
              entries = selected
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("entries=" + json.dumps(entries) + "\n")

  rehearsal-entries:
    needs: select-entries
    if: inputs.rehearsal || inputs.rehearsal-only
    uses: $/.github/workflows/get-entries.yml
    with:
      category: bug-fix
      test-run: true

  select-rehearsal-entries:
    needs: rehearsal-entries
    if: (inputs.rehearsal || inputs.rehearsal-only) && needs.rehearsal-entries.outputs.entries != '[]'
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.select.outputs.entries }}
    steps:
      - name: Select two distinct entries from the test-run sample
        id: select
        shell: python {0}
        env:
          ENTRIES: ${{ needs.rehearsal-entries.outputs.entries }}
        run: |
          import json
          import os
          entries = json.loads(os.environ["ENTRIES"])
          if not isinstance(entries, list) or not all(isinstance(entry, str) and entry.strip() for entry in entries):
              raise SystemExit("Expected a JSON array of entry IDs.")
          selected = sorted(set(entries))[:2]
          if len(selected) != 2:
              raise SystemExit("Rehearsal requires two distinct entries.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("entries=" + json.dumps(selected) + "\n")

  rehearsal:
    needs: select-rehearsal-entries
    if: (inputs.rehearsal || inputs.rehearsal-only) && needs.select-rehearsal-entries.outputs.entries != '[]'
    runs-on: GitHub-BCBench
    timeout-minutes: 240
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        entry: ${{ fromJson(needs.select-rehearsal-entries.outputs.entries) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Allocate owned rehearsal paths
        id: paths
        shell: pwsh
        env:
          ENTRIES: ${{ needs.select-rehearsal-entries.outputs.entries }}
        run: |
          $ErrorActionPreference = 'Stop'
          $entries = @($env:ENTRIES | ConvertFrom-Json)
          if ($entries.Count -ne 2 -or @($entries | Sort-Object -Unique).Count -ne 2) { throw "Rehearsal requires exactly two distinct canary entries." }
          $invocation = [Guid]::NewGuid().ToString('N')
          "entry_root=C:\bcbench\entries\$invocation" >> $env:GITHUB_OUTPUT
          "protected_root=C:\bcbench-protected\$invocation" >> $env:GITHUB_OUTPUT
          "container_name=bcbench-$invocation" >> $env:GITHUB_OUTPUT
      - uses: $/.github/actions/setup-python-uv
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Setup isolated checkpoint rehearsal
        id: setup
        timeout-minutes: 40
        uses: $/.github/actions/setup-bugfix-lifecycle
        with:
          instance-id: ${{ matrix.entry }}
          entry-root: ${{ steps.paths.outputs.entry_root }}
          protected-root: ${{ steps.paths.outputs.protected_root }}
          container-name: ${{ steps.paths.outputs.container_name }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ github.token }}
      - name: Rehearse ten consecutive restores before any paid agent
        id: rehearsal
        timeout-minutes: 190
        shell: pwsh
        run: |
          .\scripts\Test-BugFixLifecycleCheckpoint.ps1 -ContainerName $env:BC_CONTAINER_NAME `
            -CheckpointPath (Join-Path $env:BCBENCH_LIFECYCLE_PROTECTED_ROOT 'checkpoints\official-s0.json') `
            -Iterations 10 -Fault None
      - name: Finalize even after cancellation or failed launch
        id: cleanup
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          ENTRY_ROOT: ${{ steps.paths.outputs.entry_root }}
          PROTECTED_ROOT: ${{ steps.paths.outputs.protected_root }}
          CONTAINER_NAME: ${{ steps.paths.outputs.container_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROTECTED_ROOT)) { throw "No rehearsal ownership paths were allocated." }
          .\scripts\Complete-BugFixLifecycle.ps1 -EntryRoot $env:ENTRY_ROOT -ProtectedRoot $env:PROTECTED_ROOT `
            -ContainerName $env:CONTAINER_NAME -TimeoutSeconds 180
      - name: Upload protected rehearsal evidence, never backups or leaderboard results
        id: evidence
        if: always() && steps.paths.outputs.protected_root != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.entry }}
          path: |
            ${{ steps.paths.outputs.protected_root }}/final-results/
            ${{ steps.paths.outputs.protected_root }}/workflow-*.json
          retention-days: 30
      - name: Preserve quarantine markers
        id: quarantine
        if: always() && steps.paths.outputs.protected_root != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rehearsal-quarantine-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.entry }}
          path: |
            ${{ steps.paths.outputs.protected_root }}/quarantine.json
            ${{ steps.paths.outputs.protected_root }}.quarantine.json
            ${{ steps.paths.outputs.protected_root }}.cleanup-pending.quarantine.json
          retention-days: 30
      - name: Fail closed on rehearsal quarantine
        if: always()
        shell: pwsh
        env:
          PROTECTED_ROOT: ${{ steps.paths.outputs.protected_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROTECTED_ROOT)) { throw "No rehearsal ownership paths were allocated." }
          foreach ($path in @((Join-Path $env:PROTECTED_ROOT 'quarantine.json'), "$env:PROTECTED_ROOT.quarantine.json", "$env:PROTECTED_ROOT.cleanup-pending.quarantine.json")) {
            if (Test-Path -LiteralPath $path) { throw "Rehearsal quarantined; do not promote." }
          }

  evaluate:
    needs: [select-entries, rehearsal]
    if: always() && !cancelled() && !inputs.rehearsal-only && needs.select-entries.result == 'success' && needs.select-entries.outputs.entries != '[]' && (needs.rehearsal.result == 'success' || (!inputs.rehearsal && needs.rehearsal.result == 'skipped'))
    runs-on: GitHub-BCBench
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.select-entries.outputs.entries) }}
    name: ${{ inputs.agent }} - ${{ matrix.entry }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Allocate unique paths before any setup side effects
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $invocation = [Guid]::NewGuid().ToString('N')
          "entry_root=C:\bcbench\entries\$invocation" >> $env:GITHUB_OUTPUT
          "protected_root=C:\bcbench-protected\$invocation" >> $env:GITHUB_OUTPUT
          "container_name=bcbench-$invocation" >> $env:GITHUB_OUTPUT
      - uses: $/.github/actions/setup-python-uv
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: $/.github/actions/install-agent-harnesses
      - name: Setup isolated production lifecycle
        id: setup
        timeout-minutes: 40
        uses: $/.github/actions/setup-bugfix-lifecycle
        with:
          instance-id: ${{ matrix.entry }}
          entry-root: ${{ steps.paths.outputs.entry_root }}
          protected-root: ${{ steps.paths.outputs.protected_root }}
          container-name: ${{ steps.paths.outputs.container_name }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ github.token }}
          al-mcp: ${{ inputs.al-mcp }}
          al-lsp: ${{ inputs.al-lsp }}
          bc-mcp: ${{ inputs.bc-mcp }}
      - name: Run production lifecycle
        id: evaluate
        timeout-minutes: 120
        shell: pwsh
        env:
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          INSTANCE_ID: ${{ matrix.entry }}
          BCBENCH_LIFECYCLE_REHEARSAL_ITERATIONS: ${{ inputs.test-run && '1' || '0' }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\BugFixLifecycle.psm1 -Force -DisableNameChecking
          Start-BCBenchWorkflowExecution -ProtectedRoot $env:BCBENCH_LIFECYCLE_PROTECTED_ROOT `
            -ExpectedContainerId $env:BCBENCH_LIFECYCLE_EXPECTED_CONTAINER_ID `
            -ExpectedInvocationId $env:BCBENCH_LIFECYCLE_EXPECTED_INVOCATION_ID
          uv run bcbench bugfix-lifecycle $env:AGENT $env:INSTANCE_ID `
            --model $env:MODEL `
            --entry-root $env:BCBENCH_LIFECYCLE_ENTRY_ROOT `
            --protected-root $env:BCBENCH_LIFECYCLE_PROTECTED_ROOT `
            --dataset-path $env:BCBENCH_LIFECYCLE_DATASET_PATH `
            --output-dir $env:EVALUATION_RESULTS_DIR
          if ($LASTEXITCODE -ne 0) { throw "Production lifecycle failed ($LASTEXITCODE)." }
      - name: Verify cleanup even when setup or CLI fails
        id: cleanup
        if: always()
        timeout-minutes: 5
        shell: pwsh
        env:
          ENTRY_ROOT: ${{ steps.paths.outputs.entry_root }}
          PROTECTED_ROOT: ${{ steps.paths.outputs.protected_root }}
          CONTAINER_NAME: ${{ steps.paths.outputs.container_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROTECTED_ROOT)) { throw "Lifecycle paths were not allocated; no setup was allowed." }
          .\scripts\Complete-BugFixLifecycle.ps1 -EntryRoot $env:ENTRY_ROOT `
            -ProtectedRoot $env:PROTECTED_ROOT -ContainerName $env:CONTAINER_NAME -TimeoutSeconds 180
      - name: Upload only result JSONL for summary
        id: results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          overwrite: true
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}
      - name: Upload protected lifecycle evidence separately
        id: evidence
        if: always() && steps.paths.outputs.protected_root != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.entry }}
          path: |
            ${{ steps.paths.outputs.protected_root }}/final-results/
            ${{ steps.paths.outputs.protected_root }}/workflow-*.json
          retention-days: ${{ inputs.test-run && 1 || 30 }}
      - name: Upload quarantine markers
        id: quarantine
        if: always() && steps.paths.outputs.protected_root != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lifecycle-quarantine-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.entry }}
          path: |
            ${{ steps.paths.outputs.protected_root }}/quarantine.json
            ${{ steps.paths.outputs.protected_root }}.quarantine.json
            ${{ steps.paths.outputs.protected_root }}.cleanup-pending.quarantine.json
          retention-days: 30
      - name: Fail closed on quarantine
        id: check-quarantine
        if: always()
        shell: pwsh
        env:
          PROTECTED_ROOT: ${{ steps.paths.outputs.protected_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROTECTED_ROOT)) { throw "Cannot check quarantine without allocated paths." }
          foreach ($path in @((Join-Path $env:PROTECTED_ROOT 'quarantine.json'), "$env:PROTECTED_ROOT.quarantine.json", "$env:PROTECTED_ROOT.cleanup-pending.quarantine.json")) {
            if (Test-Path -LiteralPath $path) { throw "Lifecycle quarantined; inspect the protected evidence artifact." }
          }

  result-artifacts:
    needs: evaluate
    if: always() && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      available: ${{ steps.artifacts.outputs.available }}
    steps:
      - id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("evaluation-results-")))] | length' | awk '{n += $1} END {print n+0}')
          if [ "$count" -gt 0 ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

  summarize-results:
    needs: [evaluate, result-artifacts]
    if: always() && needs.result-artifacts.outputs.available == 'true'
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: evaluation_results
      model: ${{ inputs.model }}
      agent: ${{ inputs.agent == 'copilot' && 'GitHub Copilot CLI' || 'Claude Code' }}
      mock: ${{ inputs.test-run }}
      category: bug-fix
      production: true
      skip-leaderboard: true
    secrets: inherit
