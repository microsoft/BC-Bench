name: Evaluation with BC Review Engine
permissions:
  contents: read
  actions: write

# Code-review evaluation runs exclusively through the BC-ALAgents review engine
# (the real PROD generate half + BCQuality), replacing the old bespoke /review prompt
# that the copilot/claude workflows used. Model comparison is done via the model input,
# which the engine threads into the Copilot CLI it spawns.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model the engine spawns for the review"
        required: false
        default: "claude-sonnet-5"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-opus-5"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.3-codex"
          - "mai-code-1-flash-picker"
          - "gemini-3.6-flash"
      engine-ref:
        description: "microsoft/BC-ALAgents ref to run the engine from"
        required: false
        default: "main"
        type: string
      bcquality-ref:
        description: "Override the BCQuality ref (e.g. a private branch/tag/sha); blank = engine default"
        required: false
        default: ""
        type: string
      bcquality-repo:
        description: "Override the BCQuality repo (e.g. a private fork); blank = engine default"
        required: false
        default: ""
        type: string
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      repeat:
        description: "Number of times to run sequentially (ignored for test runs)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      git-ref:
        description: "Branch to record for experiment tracking (auto-filled on requeue; leave blank for manual runs)"
        required: false
        default: ""
        type: string

concurrency:
  group: engine-evaluation-${{ inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run }}
      category: "code-review"

  evaluate-with-engine:
    runs-on: ${{ needs.get-entries.outputs.runner }}
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write  # the engine and the code-review semantic judge run via Copilot CLI
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup BC Container and Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: "code-review"
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-container: ${{ needs.get-entries.outputs.requires-container != 'true' }}
          skip-repo: ${{ needs.get-entries.outputs.requires-repo != 'true' }}

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install evaluation CLIs
        uses: $/.github/actions/install-eval-clis

      - name: Checkout BC-ALAgents review engine
        uses: actions/checkout@v5
        with:
          repository: microsoft/BC-ALAgents
          ref: ${{ inputs.engine-ref }}
          path: bc-alagents-engine
          token: ${{ github.token }}

      - name: Run BC Review Engine for entry ${{ matrix.entry }}
        timeout-minutes: 120
        shell: pwsh
        env:
          BC_REVIEW_ENGINE_ROOT: ${{ github.workspace }}/bc-alagents-engine
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run bcbench evaluate engine "${{ matrix.entry }}" `
            --model "${{ inputs.model }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}" `
            ${{ inputs.bcquality-ref != '' && format('--bcquality-ref "{0}"', inputs.bcquality-ref) || '' }} `
            ${{ inputs.bcquality-repo != '' && format('--bcquality-repo "{0}"', inputs.bcquality-repo) || '' }}

      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-engine
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-engine.outputs.results-dir }}
      model: ${{ inputs.model }}
      agent: "BC Review Engine"
      mock: ${{ inputs.test-run }}
      category: "code-review"
      git-ref: ${{ inputs.git-ref || github.ref_name }}
    secrets: inherit

  requeue:
    needs: summarize-results
    if: ${{ !inputs.test-run }}
    uses: $/.github/workflows/requeue-evaluation.yml
    permissions:
      contents: write
      actions: write
    with:
      workflow-file: engine-evaluation.yml
      repeat: ${{ inputs.repeat }}
      workflow-inputs: |
        {"model": "${{ inputs.model }}", "engine-ref": "${{ inputs.engine-ref }}", "bcquality-ref": "${{ inputs.bcquality-ref }}", "bcquality-repo": "${{ inputs.bcquality-repo }}", "test-run": "${{ inputs.test-run }}", "git-ref": "${{ inputs.git-ref || github.ref_name }}"}
