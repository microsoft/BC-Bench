name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv
        with:
          all-groups: true

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          # Render ruff lint findings as inline PR annotations (CI-only; local runs stay human-readable)
          RUFF_OUTPUT_FORMAT: github

      - name: Run tests
        run: uv run pytest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the PR head rather than the merge commit so coverage lines map onto the PR diff; lint-and-test covers the merge
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv
        with:
          all-groups: true

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to GitHub Code Quality
        # The action skips fork PRs and branches without a PR itself; dispatch runs have no PR number, which the API rejects
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Checkout BCQuality
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/BCQuality
          path: bcquality

      - name: Run E2E tests
        run: uv run pytest -m e2e
        env:
          BCQUALITY_ROOT: ${{ github.workspace }}/bcquality

  select-category:
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.random.outputs.category }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Select random category
        id: random
        shell: pwsh
        run: |
          $categories = (uv run bcbench category list) -split "`n" | Where-Object { $_ }
          $selected = $categories | Get-Random
          echo "category=$selected" >> $env:GITHUB_OUTPUT

  get-entries:
    needs: select-category
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: true
      category: ${{ needs.select-category.outputs.category }}

  mock-evaluation:
    runs-on: ubuntu-latest
    needs: [get-entries, select-category]
    if: needs.get-entries.outputs.entries != '[]'
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    name: Test Run for ${{ matrix.entry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Run mock evaluation for ${{ matrix.entry }}
        run: uv run bcbench evaluate mock "${{ matrix.entry }}" --category ${{ needs.select-category.outputs.category }} --output-dir evaluation_results --run-id ${{ github.run_id }}

      - name: Upload mock evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: 1

  summarize-results:
    needs: [mock-evaluation, select-category]
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.mock-evaluation.outputs.results-dir }}
      model: ${{ github.run_id }}
      agent: "mock-agent"
      mock: true
      category: ${{ needs.select-category.outputs.category }}
    secrets: inherit
