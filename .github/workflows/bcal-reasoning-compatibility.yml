name: Isolated BCAL reasoning compatibility
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: bcal-reasoning-compatibility-20261116
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: ado-read
      deployment: false
    env:
      LLM_API_ENVIRONMENT: TEST
      LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
      LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
      LLM_API_CERTIFICATE_FILE: C:\bcal-reasoning-compatibility.pfx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject corrective reruns and duplicate dispatches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'No corrective reruns authorized.' }
          $branch = [uri]::EscapeDataString($env:GITHUB_REF_NAME)
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/bcal-evaluation.yml/runs?branch=$branch&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $runs.total_count -gt 100) { throw 'Duplicate inventory unavailable.' }
          if (@($runs.workflow_runs | Where-Object { $_.id -ne [long]$env:GITHUB_RUN_ID }).Count) { throw 'This isolated branch already has a dispatch.' }
      - uses: ./.github/actions/setup-python-uv
      - uses: ./.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: Microsoft.BusinessCentral.BCal.CLI
          feed: experiment
          version: 30.0.46.49019-beta
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
      - name: Restore pinned diagnostic client and compile helper only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          uv venv .compatibility-venv --python .\.venv\Scripts\python.exe
          uv pip install --python .\.compatibility-venv\Scripts\python.exe --no-deps -r .\experiments\bcal-sdk-policy\inference-requirements.txt
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          if (-not $token) { throw 'ADO package token unavailable.' }
          Write-Output "::add-mask::$token"
          uv pip install --no-cache --python .\.compatibility-venv\Scripts\python.exe --no-deps bc-eval==0.6.1 --index "https://anything:$token@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
          $root = "$HOME\.dotnet\tools\.store\microsoft.businesscentral.bcal.cli\30.0.46.49019-beta"
          $cache = "$HOME\.nuget\packages\microsoft.businesscentral.bcal.cli\30.0.46.49019-beta"
          $discovery = & .\.compatibility-venv\Scripts\python.exe -c "import sys,json; from pathlib import Path; sys.path.insert(0,'scripts'); from bcal_reasoning_compatibility import discover_package; p,a=discover_package(Path(sys.argv[1]),Path(sys.argv[2])); print(json.dumps({'package':str(p),'archive':str(a)}))" $root $cache
          if ($LASTEXITCODE -ne 0) { throw 'Exact package discovery/hash verification failed.' }
          $located = $discovery | ConvertFrom-Json
          $package = $located.package
          dotnet build .\tools\reasoning-compatibility\NativeProbe.csproj --nologo -v:q "-p:PackageRoot=$package" -o "$env:RUNNER_TEMP\native-probe"
          "COMPAT_PACKAGE=$package" >> $env:GITHUB_ENV
          "COMPAT_ARCHIVE=$($located.archive)" >> $env:GITHUB_ENV
      - name: Verify offline budget tests before credentials or inference
        shell: pwsh
        run: |
          uv run pytest tests\test_bcal_reasoning_compatibility.py --noconftest -q --override-ini="addopts="
          if ($LASTEXITCODE -ne 0) { throw 'Offline budget tests failed.' }
      - name: Fetch runner-local certificate
        shell: pwsh
        env:
          CERT_VAULT: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERT_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          $b64 = az keyvault secret show --vault-name $env:CERT_VAULT --name $env:CERT_NAME --query value -o tsv
          if (-not $b64) { throw 'Certificate unavailable.' }
          Write-Output "::add-mask::$b64"
          [IO.File]::WriteAllBytes($env:LLM_API_CERTIFICATE_FILE, [Convert]::FromBase64String($b64))
      - name: Admit offline native wire shapes then run eighteen single-attempt cells
        shell: pwsh
        run: |
          & .\.compatibility-venv\Scripts\python.exe .\scripts\bcal_reasoning_compatibility.py --package $env:COMPAT_PACKAGE --archive $env:COMPAT_ARCHIVE --helper "$env:RUNNER_TEMP\native-probe\NativeProbe.dll" --output compatibility-sanitized --execute
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility diagnostic stopped; no corrective rerun.' }
      - name: Retain sanitized receipts only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reasoning-compatibility-sanitized
          path: compatibility-sanitized\*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove runner-local certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:LLM_API_CERTIFICATE_FILE) { Remove-Item -LiteralPath $env:LLM_API_CERTIFICATE_FILE -Force }
