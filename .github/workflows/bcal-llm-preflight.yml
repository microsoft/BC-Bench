name: BCal LLM bridge preflight

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      model:
        description: Exact external-command model alias
        required: true
        type: string

jobs:
  preflight:
    runs-on: windows-latest
    environment:
      name: ado-read
      deployment: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Build exact bridge environment
        shell: pwsh
        run: |
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$token"
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe
          $feed = "https://anything:" + $token + "@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
          uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index $feed

      - name: Fetch LLM API client certificate
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Request a real judge completion through the shared bc-eval client
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $script = @'
          from bcbench.agent.bcal.bc_eval_llm_api_bridge import install_sticky_route_compat
          install_sticky_route_compat()
          from bc_eval.llm.llm_api import create_llm_api_client
          response = create_llm_api_client().chat.completions.create(
              model="gpt-56-ceres",
              messages=[{"role": "user", "content": "Reply with exactly READY."}],
              max_completion_tokens=32,
          )
          if not response.choices or not response.choices[0].message.content:
              raise RuntimeError("Shared bc-eval client returned no judge response.")
          '@
          $script | & .\.bcal-llm-api-venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) {
            throw "Shared bc-eval judge preflight failed."
          }
          Write-Output "Shared bc-eval client returned a real judge response."

      - name: Request a real model completion through the external-command bridge
        shell: pwsh
        env:
          LLM_API_CERTIFICATE_FILE: ${{ runner.temp }}\llm-api-cert.pfx
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
        run: |
          $request = @{
            model = "${{ inputs.model }}"
            messages = @(@{ role = "user"; content = "Reply with exactly READY." })
            max_completion_tokens = 32
          } | ConvertTo-Json -Depth 5 -Compress
          $response = $request | & .\.bcal-llm-api-venv\Scripts\python.exe .\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py
          if ($LASTEXITCODE -ne 0) {
            throw "External-command bridge preflight failed."
          }
          $completion = $response | ConvertFrom-Json
          if (-not $completion.choices -or -not $completion.choices[0].message.content) {
            throw "External-command bridge returned no model response."
          }
          Write-Output "External-command bridge returned a real model response."
