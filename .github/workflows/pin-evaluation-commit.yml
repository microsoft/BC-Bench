name: Pin Evaluation Commit

on:
  workflow_call:
    inputs:
      agent:
        description: Agent identifier used in the ephemeral tag name
        required: true
        type: string
      test-run:
        description: Whether this is a test run
        required: true
        type: boolean
      repeat:
        description: Current repeat count
        required: true
        type: string
    outputs:
      tag-name:
        description: Ephemeral tag pinning the initial evaluation commit
        value: ${{ jobs.pin-commit.outputs.tag-name }}

permissions:
  contents: write

jobs:
  pin-commit:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test-run && inputs.repeat != '1' && !startsWith(github.ref, 'refs/tags/eval-run-') }}
    outputs:
      tag-name: ${{ steps.create-tag.outputs.tag-name }}
    steps:
      - name: Create ephemeral tag pinning this commit
        id: create-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="eval-run-${{ inputs.agent }}-${{ github.run_id }}"
          gh api repos/${{ github.repository }}/git/refs \
            --method POST \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="${{ github.sha }}"
          echo "tag-name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
