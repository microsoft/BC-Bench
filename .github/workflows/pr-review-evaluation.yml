name: Evaluation with BC PR Review
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      review-integration:
        description: "Experiment arm: BCQuality engine or isolated plain Copilot (no knowledge)"
        required: false
        default: "bcquality"
        type: choice
        options:
          - "bcquality"
          - "none"
      model:
        description: "Copilot model used internally by BC PR Review"
        required: false
        default: "gpt-5.6-sol"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-opus-5"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.3-codex"
          - "mai-code-1.1-flash"
          - "gemini-3.7-flash"
      engine-sha:
        description: "Full BC-ALAgents commit SHA (blank uses the default pin)"
        required: false
        default: ""
        type: string
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only evaluate added or modified entries (never publishes results)"
        required: false
        default: false
        type: boolean
      repeat:
        description: "Number of times to run sequentially (ignored for test runs)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      git-ref:
        description: "Branch to record for experiment tracking (auto-filled on requeue; leave blank for manual runs)"
        required: false
        default: ""
        type: string

concurrency:
  group: pr-review-evaluation-${{ inputs.modified-only && 'modified' || inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  pin-commit:
    uses: $/.github/workflows/pin-evaluation-commit.yml
    permissions:
      contents: write
    with:
      agent: pr-review
      # A modified-only run never requeues, so it must not leave an ephemeral tag behind.
      test-run: ${{ inputs.test-run || inputs.modified-only }}
      repeat: ${{ inputs.repeat }}

  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      modified-only: ${{ inputs.modified-only }}
      test-run: ${{ inputs.test-run }}
      category: code-review

  evaluate-with-pr-review:
    runs-on: ${{ needs.get-entries.outputs.runner }}
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: code-review
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-container: true
          skip-repo: false

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Install evaluation CLIs
        id: install-harnesses
        uses: $/.github/actions/install-agent-harnesses
        with:
          engine-sha: ${{ inputs.engine-sha }}

      - name: Run BC PR Review for entry ${{ matrix.entry }}
        id: evaluate-review
        if: inputs.review-integration != 'none'
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
          COPILOT_REVIEW_CLI_VERSION: "1.0.88"
          COPILOT_REVIEW_LEAF_MODEL: "gpt-5.6-luna"
          COPILOT_REVIEW_LEAF_EXECUTION: "serial"
          MINIMUM_SEVERITY: "Medium"
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run bcbench evaluate pr-review "${{ matrix.entry }}" `
            --model "${{ inputs.model }}" `
            --engine-path "${{ steps.install-harnesses.outputs.bc-alagents-path }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --run-id "${{ github.run_id }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Run isolated plain review for entry ${{ matrix.entry }}
        id: evaluate-plain
        if: inputs.review-integration == 'none'
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: "false"
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"
          if ("${{ inputs.repeat }}" -ne "1") { throw "Isolated comparison permits repeat=1 only." }
          uv run bcbench evaluate copilot "${{ matrix.entry }}" `
            --category code-review --isolated-review `
            --model "${{ inputs.model }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --run-id "${{ github.run_id }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload isolated plain review evidence
        if: always() && inputs.review-integration == 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plain-evidence-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/${{ github.run_id }}/_plain-review-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve bounded runtime evidence
        if: always() && inputs.review-integration != 'none'
        shell: pwsh
        env:
          ENTRY_ID: ${{ matrix.entry }}
          EVALUATION_OUTCOME: ${{ steps.evaluate-review.outcome }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python (Join-Path 'tools' 'collect_pr_review_evidence.py') `
            --source-dir (Join-Path $env:EVALUATION_RESULTS_DIR $env:WORKFLOW_RUN_ID) `
            --output-dir (Join-Path (Join-Path $env:EVALUATION_RESULTS_DIR 'runtime-evidence') $env:ENTRY_ID) `
            --entry-id "$env:ENTRY_ID" `
            --evaluation-outcome "$env:EVALUATION_OUTCOME" `
            --workflow-sha "$env:WORKFLOW_SHA" `
            --run-id "$env:WORKFLOW_RUN_ID" `
            --run-attempt "$env:WORKFLOW_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload runtime evidence
        if: always() && inputs.review-integration != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-${{ github.run_id }}-${{ matrix.entry }}
          path: |
            ${{ env.EVALUATION_RESULTS_DIR }}/runtime-evidence/${{ matrix.entry }}/evidence-status.json
            ${{ env.EVALUATION_RESULTS_DIR }}/runtime-evidence/${{ matrix.entry }}/_run-manifest.json
            ${{ env.EVALUATION_RESULTS_DIR }}/runtime-evidence/${{ matrix.entry }}/_run-metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ (inputs.test-run || inputs.modified-only) && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-pr-review
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-pr-review.outputs.results-dir }}
      model: ${{ inputs.model }}
      agent: ${{ inputs.review-integration == 'none' && 'GitHub Copilot CLI' || 'BC PR Review' }}
      # Scores only the modified entries, so publishing it to Braintrust/Kusto or the
      # leaderboard would record a partial corpus as a benchmark result.
      mock: ${{ inputs.test-run || inputs.modified-only || inputs.engine-sha != '' || inputs.review-integration == 'none' }}
      category: code-review
      git-ref: ${{ inputs.git-ref || github.ref_name }}
    secrets: inherit

  requeue:
    needs: [summarize-results, pin-commit]
    if: ${{ !cancelled() && !failure() && !inputs.test-run && !inputs.modified-only && inputs.review-integration != 'none' }}
    uses: $/.github/workflows/requeue-evaluation.yml
    permissions:
      contents: write
      actions: write
    with:
      workflow-file: pr-review-evaluation.yml
      repeat: ${{ inputs.repeat }}
      existing-tag: ${{ needs.pin-commit.outputs.tag-name }}
      workflow-inputs: |
        {"model": "${{ inputs.model }}", "engine-sha": ${{ toJSON(inputs.engine-sha) }}, "test-run": "${{ inputs.test-run }}", "git-ref": "${{ inputs.git-ref || github.ref_name }}"}
