name: Evaluation with BC PR Review
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Copilot model used internally by BC PR Review"
        required: false
        default: "gpt-5.6-luna"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-opus-5"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.3-codex"
          - "mai-code-1.1-flash"
          - "gemini-3.7-flash"
      engine-sha:
        description: "Full BC-ALAgents commit SHA (blank uses the default pin)"
        required: false
        default: ""
        type: string
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only evaluate added or modified entries (never publishes results)"
        required: false
        default: false
        type: boolean
      repeat:
        description: "Number of times to run sequentially (ignored for test runs)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      git-ref:
        description: "Branch to record for experiment tracking (auto-filled on requeue; leave blank for manual runs)"
        required: false
        default: ""
        type: string

concurrency:
  group: pr-review-evaluation-${{ inputs.modified-only && 'modified' || inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  pin-commit:
    uses: $/.github/workflows/pin-evaluation-commit.yml
    permissions:
      contents: write
    with:
      agent: pr-review
      # A modified-only run never requeues, so it must not leave an ephemeral tag behind.
      test-run: ${{ inputs.test-run || inputs.modified-only }}
      repeat: ${{ inputs.repeat }}

  get-entries:
    runs-on: ubuntu-latest
    outputs:
      entries: '["synthetic__accessibility-setselectionfilter-scope-01","synthetic__breaking-access-modifier-01","synthetic__breaking-event-subscriber-suppress-01","synthetic__breaking-notification-callback-01","synthetic__breaking-protected-var-field-01","synthetic__breaking-relocation-01","synthetic__breaking-scope-creep-unrelated-api-01","synthetic__caption-clean-01","synthetic__currrec-clean-01","synthetic__data-modeling-blocked-validation-skip-01","synthetic__data-modeling-excluded-from-calculation-01","synthetic__data-modeling-tablerelation-restriction-mismatch-01","synthetic__errh-errortype-internal-01","synthetic__errh-tryfunction-swallowed-01","synthetic__error-clean-01","synthetic__error-handling-assistedit-cancel-01","synthetic__error-handling-case-unreachable-else-01","synthetic__error-handling-drilldown-position-01","synthetic__error-handling-errorinfo-actionable-boundary-01","synthetic__error-handling-fieldno-swap-01","synthetic__error-handling-guiallowed-01","synthetic__error-handling-silent-skip-01","synthetic__error-testfield-enabled-01","synthetic__events-ishandled-added-to-shipped-event-01","synthetic__events-ishandled-reset-boundary-01","synthetic__get-clean-01","synthetic__obsolete-clean-01","synthetic__perf-batched-commit-checkpoint-01","synthetic__perf-clean-01","synthetic__perf-progress-dialog-deleteall-01","synthetic__performance-001","synthetic__performance-002","synthetic__performance-003","synthetic__performance-004","synthetic__performance-005","synthetic__performance-006","synthetic__performance-007","synthetic__performance-008","synthetic__performance-009","synthetic__performance-010","synthetic__performance-011","synthetic__performance-012","synthetic__performance-013","synthetic__performance-014","synthetic__performance-015","synthetic__performance-016","synthetic__performance-017","synthetic__performance-018","synthetic__performance-019","synthetic__performance-020","synthetic__performance-021","synthetic__performance-022","synthetic__performance-023","synthetic__performance-024","synthetic__performance-clean-01","synthetic__performance-clean-02","synthetic__performance-clean-03","synthetic__performance-clean-04","synthetic__pkget-clean-01","synthetic__privacy-001","synthetic__privacy-002","synthetic__privacy-003","synthetic__privacy-004","synthetic__privacy-005","synthetic__privacy-006","synthetic__privacy-007","synthetic__privacy-008","synthetic__privacy-009","synthetic__privacy-010","synthetic__privacy-011","synthetic__privacy-012","synthetic__privacy-013","synthetic__privacy-014","synthetic__privacy-015","synthetic__privacy-clean-01","synthetic__privacy-clean-02","synthetic__privacy-clean-03","synthetic__privacy-clean-04","synthetic__privacy-sibling-override-01","synthetic__sec-internal-not-boundary-01","synthetic__security-001","synthetic__security-002","synthetic__security-003","synthetic__security-004","synthetic__security-005","synthetic__security-006","synthetic__security-007","synthetic__security-008","synthetic__security-009","synthetic__security-011","synthetic__security-012","synthetic__security-013","synthetic__security-014","synthetic__security-015","synthetic__security-016","synthetic__security-clean-01","synthetic__security-clean-02","synthetic__security-clean-03","synthetic__security-clean-04","synthetic__style-001","synthetic__style-002","synthetic__style-003","synthetic__style-004","synthetic__style-005","synthetic__style-006","synthetic__style-007","synthetic__style-008","synthetic__style-009","synthetic__style-010","synthetic__style-011","synthetic__style-012","synthetic__style-013","synthetic__style-014","synthetic__style-015","synthetic__style-016","synthetic__style-017","synthetic__style-018","synthetic__style-clean-01","synthetic__style-clean-02","synthetic__style-clean-03","synthetic__style-clean-04","synthetic__style-duplicate-action-01","synthetic__style-field-repurpose-indent-01","synthetic__style-showmandatory-flowfield-01","synthetic__style-this-keyword-01","synthetic__style-tooltip-mismatch-01","synthetic__testing-tolerance-clean-01","synthetic__testing-ui-handler-assert-after-run-01","synthetic__upgrade-001","synthetic__upgrade-002","synthetic__upgrade-003","synthetic__upgrade-004","synthetic__upgrade-005","synthetic__upgrade-006","synthetic__upgrade-007","synthetic__upgrade-008","synthetic__upgrade-009","synthetic__upgrade-alwayslogtable-removal-01","synthetic__upgrade-broken-hook-copyrows-01","synthetic__upgrade-clean-01","synthetic__upgrade-clean-02","synthetic__upgrade-clean-03","synthetic__upgrade-clean-04","synthetic__upgrade-clean-05","synthetic__upgrade-obsolete-caption-01","synthetic__upgrade-transferfields-field-collision-01"]'
      runner: ubuntu-latest
    steps:
      - run: echo 'Using the frozen self-improvement entry set'
      - name: Require non-publishing full mode before evaluation
        shell: pwsh
        env:
          TEST_RUN: ${{ inputs.test-run }}
          MODIFIED_ONLY: ${{ inputs.modified-only }}
          REPEAT: ${{ inputs.repeat }}
          ENGINE_OVERRIDE: ${{ inputs.engine-sha }}
        run: |
          if ($env:TEST_RUN -cne 'false' -or $env:MODIFIED_ONLY -cne 'true' -or
              $env:REPEAT -cne '1' -or $env:ENGINE_OVERRIDE) { throw 'Unsupported full evaluation mode.' }

  evaluate-with-pr-review:
    runs-on: ${{ needs.get-entries.outputs.runner }}
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify frozen Bench checkout before setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -or $head -cne '${{ github.sha }}') { throw 'Wrong Bench checkout.' }
          $changes = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -or $changes) { throw 'Modified Bench checkout.' }
          $manifest = Get-Content .github/self-improvement-gate.json -Raw | ConvertFrom-Json
          if ((Get-FileHash dataset/codereview.jsonl).Hash -ine $manifest.datasetHash) { throw 'Wrong frozen Gold bytes.' }
      - name: Setup Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: code-review
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-container: true
          skip-repo: false

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install evaluation CLIs
        id: install-harnesses
        uses: $/.github/actions/install-agent-harnesses
        with:
          engine-sha: ${{ inputs.engine-sha }}

      - name: Run BC PR Review for entry ${{ matrix.entry }}
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run python -c "import base64; exec(compile(base64.b64decode(''), '<full-evaluation-runtime-v1>', 'exec'))" evaluate pr-review "${{ matrix.entry }}" `
            --model "${{ inputs.model }}" `
            --engine-path "${{ steps.install-harnesses.outputs.bc-alagents-path }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Verify executed gate pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content .github/self-improvement-gate.json -Raw | ConvertFrom-Json
          $engine = '${{ steps.install-harnesses.outputs.bc-alagents-path }}'
          $quality = Join-Path 'evaluation_results' '${{ github.run_id }}' 'bcquality'
          $engineSha = git -C $engine rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot read executed engine HEAD.' }
          $qualitySha = git -C $quality rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot read executed knowledge HEAD.' }
          $hash = (Get-FileHash dataset/codereview.jsonl -Algorithm SHA256).Hash
          $engineChanges = git -C $engine status --porcelain --untracked-files=no
          if ($LASTEXITCODE -or $engineChanges) { throw 'Executed engine checkout has uncommitted changes.' }
          if ($engineSha -ne $plan.engineCommit -or $qualitySha -ne $plan.bcQualityCommit -or $hash -ne $plan.datasetHash) {
            throw 'Executed pin chain or dataset differs from the frozen plan.'
          }
          $proof = @{
            instanceId = '${{ matrix.entry }}'; runId = '${{ github.run_id }}'
            evaluationCommit = '${{ github.sha }}'; engineCommit = $engineSha
            bcQualityCommit = $qualitySha; datasetHash = $hash
          }
          if ($plan.schemaVersion -ne 3 -or $plan.scope -cne 'full' -or
              '${{ inputs.test-run }}' -cne 'false' -or '${{ inputs.modified-only }}' -cne 'true' -or
              '${{ inputs.repeat }}' -cne '1' -or '${{ inputs.engine-sha }}' -ne '') { throw 'Full evidence requires the frozen non-publishing execution mode.' }
          $resultPath = '${{ github.run_id }}/${{ matrix.entry }}.jsonl'
          $resultFile = Join-Path 'evaluation_results' $resultPath
          if (-not (Test-Path -LiteralPath $resultFile -PathType Leaf)) { throw 'Missing full entry result.' }
          $proof.schemaVersion = 2
          $proof.runAttempt = '${{ github.run_attempt }}'
          $proof.resultPath = $resultPath
          $proof.resultHash = (Get-FileHash -LiteralPath $resultFile -Algorithm SHA256).Hash
          $proof.manifestHash = (Get-FileHash .github/self-improvement-gate.json -Algorithm SHA256).Hash
          $proof.model = '${{ inputs.model }}'
          $proof.mode = 'frozen-full-nonpublishing'
          $runtime = Get-Content gate-proof/bench-runtime.json -Raw | ConvertFrom-Json
          $proof.schemaVersion = 3
          $proof.sourceBindingHash = $runtime.sourceBindingHash
          $proof.benchHead = $runtime.benchHead
          $proof.benchTree = $runtime.benchTree
          $proof.runtime = $runtime
          New-Item -ItemType Directory gate-proof -Force | Out-Null
          $proof | ConvertTo-Json -Depth 12 | Set-Content gate-proof/gate-provenance.json
          $metrics = Join-Path 'evaluation_results' '${{ github.run_id }}' '_run-metrics.json'
          if (Test-Path $metrics) { Copy-Item $metrics gate-proof/_run-metrics.json }

      - name: Upload executed gate pins
        uses: actions/upload-artifact@v4
        with:
          name: gate-provenance-${{ github.run_id }}-${{ matrix.entry }}
          path: gate-proof/*
          if-no-files-found: error
      - name: Upload evaluation results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ (inputs.test-run || inputs.modified-only) && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-pr-review
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-pr-review.outputs.results-dir }}
      model: ${{ inputs.model }}
      agent: "BC PR Review"
      # Scores only the modified entries, so publishing it to Braintrust/Kusto or the
      # leaderboard would record a partial corpus as a benchmark result.
      mock: ${{ inputs.test-run || inputs.modified-only || inputs.engine-sha != '' }}
      category: code-review
      git-ref: ${{ inputs.git-ref || github.ref_name }}
    secrets: inherit

  requeue:
    needs: [summarize-results, pin-commit]
    if: ${{ !cancelled() && !failure() && !inputs.test-run && !inputs.modified-only }}
    uses: $/.github/workflows/requeue-evaluation.yml
    permissions:
      contents: write
      actions: write
    with:
      workflow-file: pr-review-evaluation.yml
      repeat: ${{ inputs.repeat }}
      existing-tag: ${{ needs.pin-commit.outputs.tag-name }}
      workflow-inputs: |
        {"model": "${{ inputs.model }}", "engine-sha": ${{ toJSON(inputs.engine-sha) }}, "test-run": "${{ inputs.test-run }}", "git-ref": "${{ inputs.git-ref || github.ref_name }}"}
