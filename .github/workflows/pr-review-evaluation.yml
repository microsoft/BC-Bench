name: Evaluation with BC PR Review
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Copilot model used internally by BC PR Review"
        required: false
        default: "claude-sonnet-5"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-opus-5"
          - "gpt-5.4"
          - "gpt-5.6-sol"
          - "gpt-5.6-terra"
          - "gpt-5.6-luna"
          - "gpt-5.3-codex"
          - "mai-code-1.1-flash"
          - "gemini-3.7-flash"
      leaf-model:
        description: "Model requested for domain leaf agents"
        required: false
        default: "gpt-5.4"
        type: choice
        options:
          - "gpt-5.4"
          - "claude-sonnet-5"
          - "gpt-5.6-luna"
          - "mai-code-1.1-flash"
          - "gemini-3.7-flash"
      parallel-leaves:
        description: "Dispatch isolated domain leaf agents concurrently"
        required: false
        default: false
        type: boolean
      engine-sha:
        description: "Full BC-ALAgents commit SHA"
        required: false
        default: "982663354cc340fb6fd1840fd6c5e65b47e40f9d"
        type: string
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only evaluate added or modified entries (never publishes results)"
        required: false
        default: false
        type: boolean
      repeat:
        description: "Number of times to run sequentially (ignored for test runs)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      repetition-id:
        description: "Independent repetition identifier used to allow concurrent full runs"
        required: false
        default: "default"
        type: string
      entries:
        description: "Optional JSON array of entry IDs for a focused experiment"
        required: false
        default: ""
        type: string
      git-ref:
        description: "Branch to record for experiment tracking (auto-filled on requeue; leave blank for manual runs)"
        required: false
        default: ""
        type: string

concurrency:
  group: pr-review-evaluation-${{ inputs.modified-only && 'modified' || inputs.test-run && 'test' || 'full' }}-${{ inputs.repetition-id }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results

jobs:
  pin-commit:
    uses: $/.github/workflows/pin-evaluation-commit.yml
    permissions:
      contents: write
    with:
      agent: pr-review
      # A modified-only run never requeues, so it must not leave an ephemeral tag behind.
      test-run: ${{ inputs.test-run || inputs.modified-only }}
      repeat: ${{ inputs.repeat }}

  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      modified-only: ${{ inputs.modified-only }}
      test-run: ${{ inputs.test-run }}
      category: code-review

  evaluate-with-pr-review:
    runs-on: ${{ needs.get-entries.outputs.runner }}
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix:
        entry: ${{ fromJson(inputs.entries != '' && inputs.entries || needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: code-review
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-container: true
          skip-repo: false

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Install evaluation CLIs
        id: install-harnesses
        uses: $/.github/actions/install-agent-harnesses
        with:
          engine-sha: ${{ inputs.engine-sha }}

      - name: Run BC PR Review for entry ${{ matrix.entry }}
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_REVIEW_LEAF_MODEL: ${{ inputs.leaf-model }}
          COPILOT_REVIEW_PARALLEL_LEAVES: ${{ inputs.parallel-leaves }}
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run bcbench evaluate pr-review "${{ matrix.entry }}" `
            --model "${{ inputs.model }}" `
            --engine-path "${{ steps.install-harnesses.outputs.bc-alagents-path }}" `
            --repo-path "${{ steps.setup-env.outputs.repo_path }}" `
            --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload evaluation results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ (inputs.test-run || inputs.modified-only) && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-pr-review
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-pr-review.outputs.results-dir }}
      model: ${{ inputs.model }}
      agent: "BC PR Review"
      # Scores only the modified entries, so publishing it to Braintrust/Kusto or the
      # leaderboard would record a partial corpus as a benchmark result.
      mock: ${{ inputs.test-run || inputs.modified-only || inputs.engine-sha != '' || inputs.entries != '' }}
      category: code-review
      git-ref: ${{ inputs.git-ref || github.ref_name }}
    secrets: inherit

  requeue:
    needs: [summarize-results, pin-commit]
    if: ${{ !cancelled() && !failure() && !inputs.test-run && !inputs.modified-only }}
    uses: $/.github/workflows/requeue-evaluation.yml
    permissions:
      contents: write
      actions: write
    with:
      workflow-file: pr-review-evaluation.yml
      repeat: ${{ inputs.repeat }}
      existing-tag: ${{ needs.pin-commit.outputs.tag-name }}
      workflow-inputs: |
        {"model": "${{ inputs.model }}", "leaf-model": "${{ inputs.leaf-model }}", "parallel-leaves": "${{ inputs.parallel-leaves }}", "engine-sha": ${{ toJSON(inputs.engine-sha) }}, "test-run": "${{ inputs.test-run }}", "repetition-id": "${{ inputs.repetition-id }}", "entries": ${{ toJSON(inputs.entries) }}, "git-ref": "${{ inputs.git-ref || github.ref_name }}"}
