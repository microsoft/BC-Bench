name: Get Dataset Entries
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      modified-only:
        description: Only return modified entries (for PR contexts)
        required: false
        type: boolean
        default: false
      test-run:
        description: Indicate this is a test run (with 2 entries)
        required: false
        type: boolean
        default: false
      category:
        description: Evaluation category
        required: true
        type: string
        default: "bug-fix"
      dataset:
        description: Optional NL2AL dataset selector (gold, challenge, or multiturn)
        required: false
        type: string
        default: ""
    outputs:
      entries:
        description: JSON array of dataset entries
        value: ${{ jobs.get-entries.outputs.entries }}
      runner:
        description: GitHub Actions runner label to evaluate this category on
        value: ${{ jobs.get-entries.outputs.runner }}
      requires-container:
        description: Whether this category needs a BC container ("true"/"false")
        value: ${{ jobs.get-entries.outputs.requires-container }}
      requires-repo:
        description: Whether this category needs the dataset repository cloned ("true"/"false")
        value: ${{ jobs.get-entries.outputs.requires-repo }}

jobs:
  get-entries:
    runs-on: ubuntu-latest
    env:
      EVALUATION_CATEGORY: ${{ inputs.category }}
      NL2AL_DATASET: ${{ inputs.dataset }}
    outputs:
      entries: ${{ steps.get-entries.outputs.entries }}
      runner: ${{ steps.runtime-config.outputs.runner }}
      requires-container: ${{ steps.runtime-config.outputs.requires-container }}
      requires-repo: ${{ steps.runtime-config.outputs.requires-repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.modified-only && '0' || '1' }}

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Get runtime config for matrix
        id: runtime-config
        run: uv run bcbench category runtime-config --category "$EVALUATION_CATEGORY"

      - name: Get entries for matrix
        id: get-entries
        shell: bash
        env:
          MODIFIED_ONLY: ${{ inputs.modified-only }}
          TEST_RUN: ${{ inputs.test-run }}
        run: |
          cmd=(uv run bcbench dataset list --category "$EVALUATION_CATEGORY" --github-output entries)

          if [[ -n "$NL2AL_DATASET" ]]; then
            cmd+=(--dataset "$NL2AL_DATASET")
          fi

          if [[ "$MODIFIED_ONLY" == "true" ]]; then
            cmd+=(--modified-only)
          elif [[ "$TEST_RUN" == "true" ]]; then
            cmd+=(--test-run)
          fi

          "${cmd[@]}"
