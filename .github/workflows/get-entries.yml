name: Get Dataset Entries
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      modified-only:
        description: Only return modified entries (for PR contexts)
        required: false
        type: boolean
        default: false
      test-run:
        description: Indicate this is a test run (with 2 entries)
        required: false
        type: boolean
        default: false
      category:
        description: Evaluation category
        required: true
        type: string
        default: "bug-fix"
      tier:
        description: Dataset tier to list (gold, or challenge for categories that define one)
        required: false
        type: string
        default: "gold"
      cohort:
        description: Optional checked-in evaluation cohort name
        required: false
        type: string
        default: ""
      repeat-count:
        description: Number of independent repetitions
        required: false
        type: string
        default: "1"
    outputs:
      entries:
        description: JSON array of dataset entries
        value: ${{ jobs.get-entries.outputs.entries }}
      cohort-name:
        description: Validated cohort name
        value: ${{ jobs.get-entries.outputs.cohort-name }}
      cohort-sha256:
        description: SHA-256 of the validated cohort manifest
        value: ${{ jobs.get-entries.outputs.cohort-sha256 }}
      repetition-count:
        description: Validated repetition count
        value: ${{ jobs.get-entries.outputs.repetition-count }}
      repetitions:
        description: JSON array of one-based repetition indexes
        value: ${{ jobs.get-entries.outputs.repetitions }}
      runner:
        description: GitHub Actions runner label to evaluate this category on
        value: ${{ jobs.get-entries.outputs.runner }}
      requires-container:
        description: Whether this category needs a BC container ("true"/"false")
        value: ${{ jobs.get-entries.outputs.requires-container }}
      requires-repo:
        description: Whether this category needs the dataset repository cloned ("true"/"false")
        value: ${{ jobs.get-entries.outputs.requires-repo }}

jobs:
  get-entries:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.get-entries.outputs.entries }}
      cohort-name: ${{ steps.get-entries.outputs.cohort-name }}
      cohort-sha256: ${{ steps.get-entries.outputs.cohort-sha256 }}
      repetition-count: ${{ steps.get-entries.outputs.repetition-count }}
      repetitions: ${{ steps.get-entries.outputs.repetitions }}
      runner: ${{ steps.runtime-config.outputs.runner }}
      requires-container: ${{ steps.runtime-config.outputs.requires-container }}
      requires-repo: ${{ steps.runtime-config.outputs.requires-repo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.modified-only && '0' || '1' }}

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Get runtime config for matrix
        id: runtime-config
        run: uv run bcbench category runtime-config --category ${{ inputs.category }}

      - name: Get entries for matrix
        id: get-entries
        env:
          COHORT: ${{ inputs.cohort }}
          REPEAT_COUNT: ${{ inputs.repeat-count }}
        run: |
          cmd="uv run bcbench dataset list --category ${{ inputs.category }} --tier ${{ inputs.tier }} --github-output entries"

          if [[ -n "$COHORT" ]]; then
            cmd="$cmd --cohort $COHORT"
          fi
          cmd="$cmd --repeat-count $REPEAT_COUNT"

          if [[ "${{ inputs.modified-only }}" == "true" ]]; then
            cmd="$cmd --modified-only"
          elif [[ "${{ inputs.test-run }}" == "true" ]]; then
            cmd="$cmd --test-run"
          fi

          eval "$cmd"
