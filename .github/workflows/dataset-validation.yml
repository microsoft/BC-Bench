# Designed for bug-fix and test-generation dataset, verifies the flow of building and
# testing still works as expected, avoiding regressions caused by underlying
# infrastructure changes.
name: Dataset Validation and Verification
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only verify modified entries"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: bc-artifact-verification
  cancel-in-progress: false

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      modified-only: ${{ inputs.modified-only || false }}
      test-run: ${{ inputs.test-run || false }}
      category: "bug-fix"

  resolve-artifacts:
    runs-on: [GitHub-BCBench]
    needs: get-entries
    if: needs.get-entries.outputs.entries != '[]'
    outputs:
      artifacts: ${{ steps.resolve.outputs.artifacts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install BcContainerHelper
        shell: pwsh
        run: Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease

      - name: Resolve latest URLs once per BC version
        id: resolve
        shell: pwsh
        env:
          ENTRIES_JSON: ${{ needs.get-entries.outputs.entries }}
        run: .\scripts\Resolve-BCBenchArtifactCandidates.ps1 -EntriesJson $env:ENTRIES_JSON

  verify-build-and-tests:
    runs-on: [GitHub-BCBench]
    needs: [get-entries, resolve-artifacts]
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select latest candidate for this entry
        shell: pwsh
        env:
          ARTIFACTS_JSON: ${{ needs.resolve-artifacts.outputs.artifacts }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/BCBenchUtils.psm1 -Force -DisableNameChecking
          $version = Get-BCBenchEntryVersion -InstanceId "${{ matrix.entry }}" -Category 'bug-fix'
          $candidates = $env:ARTIFACTS_JSON | ConvertFrom-Json -AsHashtable
          if (-not $candidates.ContainsKey($version)) { throw "No candidate artifact URL for BC $version" }
          $url = Get-BCBenchArtifactUrl -Version $version -CandidateUrl $candidates[$version]
          "BCBENCH_CANDIDATE_ARTIFACT_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup BC Container and Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: "bug-fix"
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build and test verification for ${{ matrix.entry }}
        timeout-minutes: 60
        run: .\scripts\Verify-BuildAndTests.ps1 -InstanceId "${{ matrix.entry }}" -RepoPath "${{ steps.setup-env.outputs.repo_path }}"
        shell: pwsh

  propose-artifacts:
    runs-on: ubuntu-latest
    needs: [get-entries, resolve-artifacts, verify-build-and-tests]
    if: ${{ needs.verify-build-and-tests.result == 'success' && !inputs.test-run && !inputs.modified-only && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Propose verified BC artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES_JSON: ${{ needs.resolve-artifacts.outputs.artifacts }}
        run: |
          .\scripts\Update-BCBenchArtifacts.ps1 -CandidatesJson $env:CANDIDATES_JSON
          git diff --quiet -- config/bc-artifacts.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Pinned artifacts already match the verified latest URLs.'
            return
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not compare artifact config.' }

          $PSNativeCommandUseErrorActionPreference = $true
          $branch = "artifacts/verified-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add config/bc-artifacts.json
          git commit -m "Update verified BC artifact URLs"
          git push origin $branch

          $body = "All bug-fix entries passed against these URLs in [dataset verification](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). BC Insider URLs are unchanged."
          gh pr create --base main --head $branch --title "Update verified BC artifact URLs" --body $body
          gh pr merge $branch --auto --squash --delete-branch
