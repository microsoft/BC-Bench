# Designed for bug-fix and test-generation dataset, verifies the flow of building and
# testing still works as expected, avoiding regressions caused by underlying
# infrastructure changes.
name: Dataset Validation and Verification
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only verify modified entries"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * 0"

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      modified-only: ${{ inputs.modified-only || false }}
      test-run: ${{ inputs.test-run || false }}
      category: "bug-fix"

  verify-build-and-tests:
    runs-on: [GitHub-BCBench]
    needs: get-entries
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup BC Container and Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: "bug-fix"
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build and test verification for ${{ matrix.entry }}
        timeout-minutes: 60
        run: .\scripts\Verify-BuildAndTests.ps1 -InstanceId "${{ matrix.entry }}" -RepoPath "${{ steps.setup-env.outputs.repo_path }}"
        shell: pwsh

  refresh-artifacts:
    runs-on: ubuntu-latest
    needs: verify-build-and-tests
    if: github.event_name == 'schedule' && needs.verify-build-and-tests.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refresh pinned artifact URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          Import-Module BcContainerHelper -Force -DisableNameChecking

          $path = 'scripts/BCBenchUtils.psm1'
          $content = [IO.File]::ReadAllText($path)
          $matches = [regex]::Matches($content, "'(?<version>\d+\.\d+)' = '(?<url>https://bcartifacts[^']+)'")
          if ($matches.Count -eq 0) { throw 'No pinned public BC artifact URLs found.' }
          foreach ($match in $matches) {
            $version = $match.Groups['version'].Value
            $url = Get-BCArtifactUrl -version $version -country 'w1' -select 'Latest'
            $content = $content.Replace($match.Value, "'$version' = '$url'")
          }
          [IO.File]::WriteAllText($path, $content)

          git diff --quiet
          if ($LASTEXITCODE -eq 0) { return }

          $PSNativeCommandUseErrorActionPreference = $true
          $branch = "artifacts/refresh-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add $path
          git commit -m 'Refresh pinned BC artifact URLs'
          git push origin $branch
          gh pr create --base main --head $branch --title 'Refresh pinned BC artifact URLs' --body 'Updates the pinned public BC artifact URLs after the weekly dataset verification succeeded.'
