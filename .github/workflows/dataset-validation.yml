# Designed for bug-fix and test-generation dataset, verifies the flow of building and
# testing still works as expected, avoiding regressions caused by underlying
# infrastructure changes.
name: Dataset Validation and Verification
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      modified-only:
        description: "Only verify modified entries"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * 0"

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      modified-only: ${{ inputs.modified-only || false }}
      test-run: ${{ inputs.test-run || false }}
      category: "bug-fix"

  prepare-artifacts:
    runs-on: ubuntu-latest
    needs: get-entries
    if: github.event_name == 'schedule' && needs.get-entries.outputs.entries != '[]'
    outputs:
      pins: ${{ steps.refresh.outputs.pins }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh pinned artifact URLs
        id: refresh
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          Import-Module BcContainerHelper -Force -DisableNameChecking
          Import-Module ./scripts/BenchmarkUtils.psm1 -Force -DisableNameChecking

          $latestUrls = Get-BCBenchLatestArtifactUrls
          $urlsJson = ($latestUrls | ConvertTo-Json -Depth 2) + "`n"
          $pins = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($urlsJson))
          "pins=$pins" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  verify-build-and-tests:
    runs-on: [GitHub-BCBench]
    needs: [get-entries, prepare-artifacts]
    if: always() && needs.get-entries.result == 'success' && needs.get-entries.outputs.entries != '[]' && (github.event_name != 'schedule' || needs.prepare-artifacts.result == 'success')
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use refreshed artifact URLs
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          PINS: ${{ needs.prepare-artifacts.outputs.pins }}
        run: |
          [IO.File]::WriteAllBytes((Join-Path 'scripts' 'BCBenchArtifactPins.json'), [Convert]::FromBase64String($env:PINS))

      - name: Setup BC Container and Repository
        id: setup-env
        timeout-minutes: 40
        uses: $/.github/actions/setup-bc-container-repo
        with:
          instance-id: ${{ matrix.entry }}
          category: "bug-fix"
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build and test verification for ${{ matrix.entry }}
        timeout-minutes: 60
        run: .\scripts\Verify-BuildAndTests.ps1 -InstanceId "${{ matrix.entry }}" -RepoPath "${{ steps.setup-env.outputs.repo_path }}"
        shell: pwsh

  propose-artifacts:
    runs-on: ubuntu-latest
    needs: [prepare-artifacts, verify-build-and-tests]
    if: github.event_name == 'schedule' && needs.verify-build-and-tests.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply verified artifact URLs
        shell: pwsh
        env:
          PINS: ${{ needs.prepare-artifacts.outputs.pins }}
        run: |
          [IO.File]::WriteAllBytes((Join-Path 'scripts' 'BCBenchArtifactPins.json'), [Convert]::FromBase64String($env:PINS))

      - name: Push verified artifact branch for manual PR
        shell: pwsh
        run: |
          $path = Join-Path 'scripts' 'BCBenchArtifactPins.json'
          git diff --quiet -- $path
          if ($LASTEXITCODE -eq 0) { return }
          if ($LASTEXITCODE -ne 1) { throw 'Could not compare artifact pins.' }

          $PSNativeCommandUseErrorActionPreference = $true
          $branch = "artifacts/refresh-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add $path
          git commit -m 'Refresh pinned BC artifact URLs'
          git push origin $branch
