name: Contamination - File-path Identification

# Context-free bug localization task (SWE-Bench Illusion, arXiv:2506.12286):
# the model sees ONLY the bug report — no repository, no code — and must name the
# file(s) that contain the bug. Because it needs no BC container or build, this
# runs cheaply on ubuntu-latest. Interpret the result RELATIVELY: pass a --cutoff
# so old/public entries are compared against fresh control entries. The delta,
# not the absolute rate, is the memorization signal.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Copilot model to evaluate"
        required: false
        default: "claude-haiku-4.5"
        type: choice
        options:
          - "claude-sonnet-4.6"
          - "claude-haiku-4.5"
          - "claude-opus-4.6"
          - "claude-opus-4.7"
          - "claude-opus-4.8"
          - "gpt-5.5"
          - "gpt-5.4"
          - "gpt-5.3-codex"
          - "gpt-5.2-codex"
          - "gpt-5.2"
      category:
        description: "Dataset category (must be patch-based)"
        required: false
        default: "bug-fix"
        type: choice
        options:
          - "bug-fix"
          - "test-generation"
      top-k:
        description: "Number of candidate file paths to request per entry"
        required: false
        default: "3"
        type: string
      cutoff:
        description: "ISO date (YYYY-MM-DD). Entries created before it are treated as potentially-contaminated; on/after as the clean control. Leave blank for an absolute-rate baseline."
        required: false
        default: ""
        type: string
      test-run:
        description: "Quick run over a handful of random entries"
        required: false
        default: true
        type: boolean
  schedule:
    # Weekly full run, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: contamination-file-path-identification-${{ inputs.category || 'bug-fix' }}
  cancel-in-progress: false

env:
  IDENTIFICATION_RESULTS_DIR: identification_results

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run || false }}
      category: ${{ inputs.category || 'bug-fix' }}

  identify:
    name: ${{ matrix.entry }}
    runs-on: ubuntu-latest
    needs: get-entries
    if: needs.get-entries.outputs.entries != '[]'
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install evaluation CLIs
        uses: $/.github/actions/install-eval-clis

      - name: Run file-path identification for entry ${{ matrix.entry }}
        timeout-minutes: 20
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          Write-Output "::add-mask::$env:COPILOT_GITHUB_TOKEN"

          uv run bcbench contamination file-path-identification "${{ matrix.entry }}" `
            --category "${{ inputs.category || 'bug-fix' }}" `
            --model "${{ inputs.model || 'claude-haiku-4.5' }}" `
            --top-k ${{ inputs.top-k || '3' }} `
            --output-dir "${{ env.IDENTIFICATION_RESULTS_DIR }}"

      - name: Upload identification result
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: identification-result-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.IDENTIFICATION_RESULTS_DIR }}/**/*.file-path-identification.jsonl
          retention-days: ${{ (inputs.test-run && 1) || 30 }}

  summarize:
    name: Summarize
    runs-on: ubuntu-latest
    needs: identify
    if: always() && needs.identify.result != 'skipped'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Download all identification results
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.IDENTIFICATION_RESULTS_DIR }}/
          merge-multiple: true

      - name: Summarize contamination signal
        shell: pwsh
        run: |
          # Manual runs use the dispatch input; scheduled runs fall back to the
          # CONTAMINATION_CUTOFF repo variable so the weekly report still shows the delta.
          $cutoff = "${{ inputs.cutoff || vars.CONTAMINATION_CUTOFF }}"
          $cutoffArg = if ($cutoff) { "--cutoff", $cutoff } else { @() }

          uv run bcbench contamination summarize `
            --results-dir "${{ env.IDENTIFICATION_RESULTS_DIR }}" `
            --model "${{ inputs.model || 'claude-haiku-4.5' }}" `
            @cutoffArg
