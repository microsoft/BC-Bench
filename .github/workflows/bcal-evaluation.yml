name: Evaluation with bcal
run-name: BCal ${{ inputs.evaluation-kind || 'accuracy' }} ${{ inputs.tier || 'gold' }} (${{ inputs.external-model || 'gpt-55-chat' }}) - ${{ inputs.test-run && 'test' || 'full' }}
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      evaluation-kind:
        description: "Accuracy, or NL2AL harms with pinned experimental BCal 30.0.46.28048-beta"
        required: false
        default: accuracy
        type: choice
        options:
          - accuracy
          - harms
      tier:
        description: "NL2AL dataset tier to evaluate"
        required: false
        default: gold
        type: choice
        options:
          - gold
          - challenge
      bcal-feed:
        description: "BCal package feed: official, or the internal test feed for experimental builds"
        required: false
        default: official
        type: choice
        options:
          - official
          - experiment
      bcal-version:
        description: "Exact BCal NuGet version; leave empty for the latest prerelease"
        required: false
        default: ""
        type: string
      external-model:
        description: "Model alias to use through the bc-eval M365 LLM API client"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-ceres"
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      completion-review-model:
        description: "Separate model for BCal's completion review; none uses external-model"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "gpt-56-ceres"
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: bcal-evaluation-${{ inputs.evaluation-kind || 'accuracy' }}-${{ inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  TIER: ${{ inputs.tier || 'gold' }}
  BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}

jobs:
  get-entries:
    if: inputs.evaluation-kind != 'harms'
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run || false }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Install bcal CLI from internal feed
        uses: $/.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: ${{ secrets.BCAL_PACKAGE_ID }}
          feed: ${{ inputs.bcal-feed || 'official' }}
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
          version: ${{ env.BCAL_REQUESTED_VERSION }}

      - name: Build bc-eval LLM API bridge venv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        shell: pwsh
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category nl2al --tier "$env:TIER" --github-output version

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category nl2al -Tier "$env:TIER" -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for LLM API certificate Key Vault
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch LLM API client certificate from Key Vault
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CERTIFICATE_KEY_VAULT_NAME -or -not $env:CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set."
          }
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
          BCAL_COMPLETION_REVIEW_MODEL: ${{ inputs.completion-review-model != 'none' && inputs.completion-review-model || '' }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
        shell: pwsh
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          if (-not (Test-Path $env:LLM_API_CERTIFICATE_FILE)) {
            throw "Expected LLM API client cert at $env:LLM_API_CERTIFICATE_FILE but it was not fetched from Key Vault."
          }
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"

          uv run bcbench evaluate bcal "${{ matrix.entry }}" --tier "$env:TIER" --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload evaluation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  evaluate-harms:
    if: inputs.evaluation-kind == 'harms'
    runs-on: windows-latest
    timeout-minutes: 240
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
      copilot-requests: write
    env:
      HARMS_OUTPUT: C:\bcr\${{ github.run_id }}
      BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
      COPILOT_GITHUB_TOKEN: ${{ github.token }}
      LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
      LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate harms selection
        shell: pwsh
        env:
          SELECTED_TIER: ${{ inputs.tier }}
          SELECTED_REVIEW: ${{ inputs.completion-review-model }}
        run: |
          if ($env:SELECTED_TIER -ne 'gold') { throw 'Harms supports only its fixed gold base entry.' }
          if ($env:SELECTED_REVIEW -ne 'none') { throw 'Separate completion review is not supported by this harms capture path.' }

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Install pinned BCal
        uses: ./.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: Microsoft.BusinessCentral.BCal.CLI
          feed: experiment
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
          version: 30.0.46.28048-beta

      - name: Setup isolated bridge
        shell: pwsh
        run: |
          .\scripts\Setup-BCalBridge.ps1 -PythonFeedUrl 'https://dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/'
          $version = bcal --version
          if ($version -ne '30.0.46.28048+7c5514f77dc3346194813ec8d6a475f654d685ab') {
            throw "Unexpected runtime: $version"
          }

      - name: Setup Node.js for the objective judge
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install objective judge
        shell: pwsh
        run: npm install -g @github/copilot@1.0.82

      - name: Cache pinned BC artifacts
        id: harms-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-harms-28.0.46665.52171

      - name: Download pinned BC artifacts
        if: steps.harms-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          Import-Module BcContainerHelper
          $url = Get-BCArtifactUrl -version '28.0.46665.52171' -country w1 -select Latest
          if (-not $url) { throw 'Pinned BC artifact is unavailable.' }
          Download-Artifacts -artifactUrl $url -includePlatform

      - name: Fetch LLM API certificate
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) { throw 'LLM API certificate retrieval failed.' }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Capture NL2AL harms
        shell: pwsh
        env:
          BOUNDED: ${{ inputs.test-run }}
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          $selection = if ($env:BOUNDED -eq 'true') {
            @{ Limit = 1; Vector = @('direct', 'symbols', 'page_inspector') }
          } else { @{ Full = $true } }
          .\scripts\Run-NL2ALEvaluation.ps1 -Category harms -BcalExecutable (Get-Command bcal).Source `
            -ArtifactVersion 28.0.46665.52171 -Model $env:BCAL_LLM_MODEL `
            -ResultsDirectory "$env:HARMS_OUTPUT\capture" @selection

      - name: Judge objectives and check coverage
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "$env:HARMS_OUTPUT\capture\harms\trials.jsonl")) { throw 'No captured trials to score.' }
          .\.venv\Scripts\python.exe -m bcbench harms score "$env:HARMS_OUTPUT\capture\harms" `
            --model gpt-5.3-codex --output-dir "$env:HARMS_OUTPUT\objective-scores"
          $summary = Get-Content "$env:HARMS_OUTPUT\objective-scores\scoring-summary.json" -Raw | ConvertFrom-Json
          if ($summary.attempted -ne $summary.delivered -or $summary.delivered -ne $summary.scored) {
            throw 'Incomplete delivery/scoring coverage; retained artifacts are not a full resistance result.'
          }

      - name: Upload harms evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nl2al-harms-${{ github.run_id }}
          path: |
            ${{ env.HARMS_OUTPUT }}\capture\protocol.json
            ${{ env.HARMS_OUTPUT }}\capture\execution-summary.json
            ${{ env.HARMS_OUTPUT }}\capture\harms.console.txt
            ${{ env.HARMS_OUTPUT }}\capture\harms\*.json*
            ${{ env.HARMS_OUTPUT }}\capture\harms\logs\*.jsonl
            ${{ env.HARMS_OUTPUT }}\capture\harms\exports\**\*.al
            ${{ env.HARMS_OUTPUT }}\objective-scores\*.json*
          if-no-files-found: warn
          retention-days: 7

  summarize-results:
    needs: evaluate-with-bcal
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-bcal.outputs.results-dir }}
      model: ${{ inputs.external-model || 'gpt-55-chat' }}
      agent: BCal-external-command
      mock: ${{ inputs.test-run || false }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}
      experiment: ${{ inputs.bcal-feed == 'experiment' }}
      skip-leaderboard: true
    secrets: inherit
