name: BCal report skill experiment
run-name: Report skill ${{ inputs.variant }} r${{ inputs.repetition }} [${{ github.ref_name }}]

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Authorized report-skill variant
        required: true
        type: choice
        options:
          - permanent-full-report-guidance
          - model-triggered-report-skill
          - host-triggered-report-skill
          - forced-model-activation
          - host-deterministic
          - permanent-contract-smoke
      repetition:
        description: Authorized one-based repetition
        required: true
        type: choice
        options:
          - "1"
          - "2"
      publication-source-run-id:
        description: Existing execution run to publish without rerunning semantic cells
        required: false
        type: string
        default: ""

concurrency:
  group: bcal-report-skill-${{ github.ref_name }}-${{ inputs.variant }}-r${{ inputs.repetition }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: ${{ inputs.publication-source-run-id || github.run_id }}
  EVALUATION_RESULTS_DIR: evaluation_results
  SELECTOR_PATH: ${{ startsWith(github.ref_name, 'bcal-report-skill-quality-rerun-20261109') && 'dataset/experiments/bcal_report_skill_quality_rerun_v1.json' || ((inputs.variant == 'forced-model-activation' || inputs.variant == 'host-deterministic' || inputs.variant == 'permanent-contract-smoke') && 'dataset/experiments/bcal_report_skill_gate_b_calibration_v1.json' || 'dataset/experiments/bcal_report_skill_progressive_disclosure_v1.json') }}

jobs:
  validate-selection:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.selector.outputs.entries }}
      study-id: ${{ steps.selector.outputs.study-id }}
      selector-sha256: ${{ steps.selector.outputs.selector-sha256 }}
      model: ${{ steps.selector.outputs.model }}
      package-id: ${{ steps.selector.outputs.package-id }}
      package-version: ${{ steps.selector.outputs.package-version }}
      package-identity: ${{ steps.selector.outputs.package-identity }}
      package-source-sha: ${{ steps.selector.outputs.package-source-sha }}
      variant-patch-sha: ${{ steps.selector.outputs.variant-patch-sha }}
      nupkg-file: ${{ steps.selector.outputs.nupkg-file }}
      nupkg-sha256: ${{ steps.selector.outputs.nupkg-sha256 }}
      nupkg-size: ${{ steps.selector.outputs.nupkg-size }}
      activation-policy: ${{ steps.selector.outputs.activation-policy }}
      activation-source: ${{ steps.selector.outputs.activation-source }}
      activation-mode: ${{ steps.selector.outputs.activation-mode }}
      requested-tool-call-id: ${{ steps.selector.outputs.requested-tool-call-id }}
      skill-id: ${{ steps.selector.outputs.skill-id }}
      skill-contract: ${{ steps.selector.outputs.skill-contract }}
      skill-content-sha256: ${{ steps.selector.outputs.skill-content-sha256 }}
      skill-revision: ${{ steps.selector.outputs.skill-revision }}
      skill-catalog-segment: ${{ steps.selector.outputs.skill-catalog-segment }}
      skill-activated-segment: ${{ steps.selector.outputs.skill-activated-segment }}
      require-offered-tool-evidence: ${{ steps.selector.outputs.require-offered-tool-evidence }}
      workflow-ref: ${{ steps.selector.outputs.workflow-ref }}
    steps:
      - name: Checkout immutable study ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate authorized selector
        id: selector
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          REPETITION: ${{ inputs.repetition }}
          PUBLICATION_SOURCE_RUN_ID: ${{ inputs.publication-source-run-id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path(os.environ["SELECTOR_PATH"])
          config = json.loads(path.read_text(encoding="utf-8"))
          auth = config["authorization"]
          variant_id = os.environ["VARIANT"]
          repetition = int(os.environ["REPETITION"])
          variant = config["variants"][variant_id]
          package = variant["package"]
          cohort_entries = config["cohort"]["entries"]
          entries = [variant["entry"]] if "entry" in variant else cohort_entries
          expected_ref = auth["workflow_ref"]
          publication_source = os.environ.get("PUBLICATION_SOURCE_RUN_ID", "")
          if auth["state"] != "authorized":
              raise SystemExit("Selector is not authorized.")
          if not publication_source and os.environ["GITHUB_REF_NAME"] != expected_ref:
              raise SystemExit(f"Workflow must run from immutable ref {expected_ref}.")
          recovery_refs = {
              "bcal-report-skill-publication-recovery-v3-20261108",
              f"{expected_ref}-publication-recovery-v1",
              f"{expected_ref}-publication-recovery-v2",
              f"{expected_ref}-publication-recovery-v3",
              f"{expected_ref}-publication-recovery-v4",
          }
          if publication_source and os.environ["GITHUB_REF_NAME"] not in recovery_refs:
              raise SystemExit("Publication recovery must run from its immutable recovery ref.")
          if repetition not in range(1, config["execution"]["repeat_count"] + 1):
              raise SystemExit("Repetition is outside the authorized range.")
          if len(cohort_entries) not in {3, 6} or len(set(cohort_entries)) != len(cohort_entries):
              raise SystemExit("Selector must contain exactly three calibration probes or six quality-study cases.")
          if any(entry not in cohort_entries for entry in entries):
              raise SystemExit("Selected variant entry is outside the immutable cohort.")
          if any("control-tower" in entry for entry in entries):
              raise SystemExit("Control Tower is prohibited.")
          if any(not entry.startswith("bcal-scenario__report-") for entry in entries):
              raise SystemExit("Only the focused report cohort is authorized.")
          cells_per_variant = sum(1 if "entry" in item else len(cohort_entries) for item in config["variants"].values())
          if auth["authorized_cell_count"] != cells_per_variant * config["execution"]["repeat_count"]:
              raise SystemExit("Authorized cell count does not match the selector matrix.")
          base = config["github"]["required_fixed_base_sha"]
          if subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"]).returncode:
              raise SystemExit("Study ref is not based on the repaired #1011 head.")
          blob = subprocess.check_output(["git", "show", f"HEAD:{path.as_posix()}"])
          selector_sha = hashlib.sha256(blob).hexdigest()
          values = {
              "entries": json.dumps(entries, separators=(",", ":")),
              "study-id": auth["authorized_study_id"],
              "selector-sha256": selector_sha,
              "model": config["execution"]["model"],
              "package-id": package["package_id"],
              "package-version": package["package_version"],
              "package-identity": package["installed_identity"],
              "package-source-sha": package["package_source_commit_sha"],
              "variant-patch-sha": package["variant_patch_sha"],
              "nupkg-file": package["nupkg_file"],
              "nupkg-sha256": package["nupkg_sha256"],
              "nupkg-size": package["nupkg_size"],
              "activation-policy": variant["skill_activation_policy"],
              "activation-source": variant["skill_activation_source"] or "",
              "activation-mode": variant["expected_activation_mode"],
              "requested-tool-call-id": variant["requested_tool_call_id"],
              "skill-id": config["skill"]["id"],
              "skill-contract": config["skill"]["contract_version"],
              "skill-content-sha256": config["skill"]["content_sha256"],
              "skill-revision": config["skill"]["revision"],
              "skill-catalog-segment": config["skill"]["catalog_segment"],
              "skill-activated-segment": config["skill"]["activated_segment"],
              "require-offered-tool-evidence": str(variant.get("require_offered_tool_evidence", False)).lower(),
              "workflow-ref": auth["workflow_ref"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

  evaluate:
    needs: validate-selection
    if: inputs.publication-source-run-id == ''
    runs-on: windows-latest
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        entry: ${{ fromJson(needs.validate-selection.outputs.entries) }}
    name: ${{ matrix.entry }}
    steps:
      - name: Checkout immutable study ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install exact BCal package
        shell: pwsh
        env:
          PACKAGE_ID: ${{ needs.validate-selection.outputs.package-id }}
          PACKAGE_VERSION: ${{ needs.validate-selection.outputs.package-version }}
          EXPECTED_IDENTITY: ${{ needs.validate-selection.outputs.package-identity }}
          NUPKG_FILE: ${{ needs.validate-selection.outputs.nupkg-file }}
          NUPKG_SHA256: ${{ needs.validate-selection.outputs.nupkg-sha256 }}
          NUPKG_SIZE: ${{ needs.validate-selection.outputs.nupkg-size }}
          FEED_URL: ${{ secrets.BCAL_TEST_FEED_URL }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$token"
          $env:VSS_NUGET_EXTERNAL_FEED_ENDPOINTS = @{
            endpointCredentials = @(@{ endpoint = $env:FEED_URL; username = "anything"; password = $token })
          } | ConvertTo-Json -Compress -Depth 5
          dotnet tool install --global Microsoft.Artifacts.CredentialProvider.NuGet.Tool
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet tool install --global $env:PACKAGE_ID --version $env:PACKAGE_VERSION --source $env:FEED_URL
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "Exact BCal package install failed." }
            Start-Sleep -Seconds 20
          }
          $identity = (& bcal --version 2>&1 | Out-String).Trim()
          if ($identity -ne $env:EXPECTED_IDENTITY) {
            throw "Expected BCal identity '$env:EXPECTED_IDENTITY', found '$identity'."
          }
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("anything:$token"))
          $headers = @{ Authorization = "Basic $basic" }
          $feedIndex = Invoke-RestMethod -Uri $env:FEED_URL -Headers $headers
          $packageBaseAddress = $feedIndex.resources |
            Where-Object { $_.'@type' -like "PackageBaseAddress*" } |
            Select-Object -First 1 -ExpandProperty '@id'
          if (-not $packageBaseAddress) { throw "NuGet feed does not expose a package base address." }
          $packageId = $env:PACKAGE_ID.ToLowerInvariant()
          $packageVersion = $env:PACKAGE_VERSION.ToLowerInvariant()
          $archivePath = Join-Path $env:RUNNER_TEMP $env:NUPKG_FILE
          $archiveUrl = "$($packageBaseAddress.TrimEnd('/'))/$packageId/$packageVersion/$packageId.$packageVersion.nupkg"
          Invoke-WebRequest -Uri $archiveUrl -Headers $headers -OutFile $archivePath
          $archive = Get-Item $archivePath
          $hash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          if ($hash -ne $env:NUPKG_SHA256 -or $archive.Length -ne [long]$env:NUPKG_SIZE) {
            throw "Installed nupkg bytes do not match the authorized selector."
          }

      - name: Build exact bridge environment
        shell: pwsh
        run: |
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$token"
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe
          $feed = "https://anything:" + $token + "@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
          uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index $feed

      - name: Resolve BC version
        id: bcversion
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category bcal-scenario --github-output version

      - name: Cache BC symbols
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category bcal-scenario -InstanceId "${{ matrix.entry }}"

      - name: Fetch LLM API certificate
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) { throw "Failed to fetch LLM API client certificate." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run authorized report case
        timeout-minutes: 28
        shell: pwsh
        env:
          BCAL_LLM_MODEL: ${{ needs.validate-selection.outputs.model }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
          BCBENCH_STUDY_ID: ${{ needs.validate-selection.outputs.study-id }}
          BCBENCH_VARIANT_ID: ${{ inputs.variant }}
          BCBENCH_REPETITION_INDEX: ${{ inputs.repetition }}
          BCBENCH_REPETITION_COUNT: "2"
          BCBENCH_SELECTOR_GIT_BLOB_SHA256: ${{ needs.validate-selection.outputs.selector-sha256 }}
          BCBENCH_PACKAGE_VERSION: ${{ needs.validate-selection.outputs.package-version }}
          BCBENCH_PACKAGE_SOURCE_SHA: ${{ needs.validate-selection.outputs.package-source-sha }}
          BCBENCH_VARIANT_PATCH_SHA: ${{ needs.validate-selection.outputs.variant-patch-sha }}
          BCBENCH_EXPECTED_ACTIVATION_MODE: ${{ needs.validate-selection.outputs.activation-mode }}
          BCBENCH_BCAL_SKILL_ACTIVATION_POLICY: ${{ needs.validate-selection.outputs.activation-policy }}
          BCBENCH_BCAL_SKILL_ACTIVATION_SOURCE: ${{ needs.validate-selection.outputs.activation-source }}
          BCBENCH_BCAL_EXPECTED_ACTIVATION_MODE: ${{ needs.validate-selection.outputs.activation-mode }}
          BCBENCH_BCAL_REQUESTED_TOOL_CALL_ID: ${{ needs.validate-selection.outputs.requested-tool-call-id }}
          BCBENCH_BCAL_REPORT_SKILL_ID: ${{ needs.validate-selection.outputs.skill-id }}
          BCBENCH_BCAL_SKILL_CONTRACT_VERSION: ${{ needs.validate-selection.outputs.skill-contract }}
          BCBENCH_BCAL_SKILL_CONTENT_SHA256: ${{ needs.validate-selection.outputs.skill-content-sha256 }}
          BCBENCH_BCAL_SKILL_REVISION: ${{ needs.validate-selection.outputs.skill-revision }}
          BCBENCH_BCAL_SKILL_CATALOG_SEGMENT: ${{ needs.validate-selection.outputs.skill-catalog-segment }}
          BCBENCH_BCAL_SKILL_ACTIVATED_SEGMENT: ${{ needs.validate-selection.outputs.skill-activated-segment }}
          BCBENCH_BCAL_REQUIRE_OFFERED_TOOL_EVIDENCE: ${{ needs.validate-selection.outputs.require-offered-tool-evidence }}
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"
          uv run bcbench evaluate bcal "${{ matrix.entry }}" --category bcal-scenario --output-dir "$env:EVALUATION_RESULTS_DIR" --run-id "$env:GITHUB_RUN_ID"

      - name: Upload immutable case result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**
          retention-days: 30

  publish:
    needs: [validate-selection, evaluate]
    if: always() && !cancelled() && needs.validate-selection.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ado-read
      deployment: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BCBENCH_STUDY_ID: ${{ needs.validate-selection.outputs.study-id }}
      BCBENCH_VARIANT_ID: ${{ inputs.variant }}
      BCBENCH_REPETITION_INDEX: ${{ inputs.repetition }}
      BCBENCH_REPETITION_COUNT: "2"
      BCBENCH_SELECTOR_GIT_BLOB_SHA256: ${{ needs.validate-selection.outputs.selector-sha256 }}
      BCBENCH_PACKAGE_VERSION: ${{ needs.validate-selection.outputs.package-version }}
      BCBENCH_PACKAGE_SOURCE_SHA: ${{ needs.validate-selection.outputs.package-source-sha }}
      BCBENCH_VARIANT_PATCH_SHA: ${{ needs.validate-selection.outputs.variant-patch-sha }}
      BCBENCH_EXPECTED_ACTIVATION_MODE: ${{ needs.validate-selection.outputs.activation-mode }}
      BCBENCH_BCAL_SKILL_ACTIVATION_POLICY: ${{ needs.validate-selection.outputs.activation-policy }}
      BCBENCH_BCAL_SKILL_ACTIVATION_SOURCE: ${{ needs.validate-selection.outputs.activation-source }}
      BCBENCH_BCAL_REQUIRE_OFFERED_TOOL_EVIDENCE: ${{ needs.validate-selection.outputs.require-offered-tool-evidence }}
    steps:
      - name: Checkout immutable study ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Download case artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evaluation-results-${{ env.SOURCE_RUN_ID }}-*
          path: ${{ env.EVALUATION_RESULTS_DIR }}
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Preserve authorized pre-model infrastructure failure
        if: inputs.publication-source-run-id == '42651238085'
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          from bcbench.results.bcal_scenario import BCalScenarioEvaluationResult

          run = Path(os.environ["EVALUATION_RESULTS_DIR"]) / os.environ["SOURCE_RUN_ID"]
          run.mkdir(parents=True, exist_ok=True)
          entry = "bcal-scenario__report-repair-and-extend-1"
          failure = {
              "instance_id": entry,
              "project": "app",
              "model": "gpt-55-chat",
              "agent_name": "BCal",
              "category": "bcal-scenario",
              "agent_version": None,
              "timeout": False,
              "output": "Pre-model infrastructure failure: exact package archive verification download failed before BCal execution.",
              "error_message": "BCal package archive verification failed before model execution: transport connection forcibly closed by remote host.",
              "metrics": {
                  "kind": "generic",
                  "execution_time": 0.0,
                  "llm_duration": None,
                  "ai_credits": None,
                  "turn_count": 0,
                  "prompt_tokens": 0,
                  "completion_tokens": 0,
                  "total_tokens": 0,
                  "tool_usage": {},
              },
              "experiment": {
                  "mcp_servers": None,
                  "al_lsp_enabled": False,
                  "custom_instructions": False,
                  "skills_enabled": False,
                  "custom_agent": None,
                  "plugins": None,
              },
              "judge_model": "gpt-41-2025-04-14",
              "scenario_completed": False,
              "independent_build": {
                  "status": "not_attempted",
                  "message": "Package verification failed before workspace evaluation.",
              },
              "trace_compliance": False,
              "trace_assertions": [],
              "runtime_status": None,
              "harness_failure": True,
              "execution_identity": None,
              "workspace_seed": None,
              "prompt_evidence": None,
              "canonical_trace": None,
              "semantic_metrics_eligible": False,
          }
          validated = BCalScenarioEvaluationResult.model_validate(failure)
          (run / f"{entry}.jsonl").write_text(validated.model_dump_json() + "\n", encoding="utf-8")
          artifacts = run / "artifacts"
          artifacts.mkdir(exist_ok=True)
          receipt = json.dumps(
              {
                  "sourceRunId": os.environ["SOURCE_RUN_ID"],
                  "entry": entry,
                  "phase": "package_archive_verification",
                  "modelInvoked": False,
                  "semanticMetricsEligible": False,
                  "error": failure["error_message"],
              },
              indent=2,
          )
          with zipfile.ZipFile(artifacts / f"{entry}-workspace.zip", "w") as archive:
              archive.writestr("pre-model-failure.json", receipt)
          PY

      - name: Verify complete immutable coverage
        shell: bash
        env:
          EXPECTED_ENTRIES: ${{ needs.validate-selection.outputs.entries }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = Path(os.environ["EVALUATION_RESULTS_DIR"]) / os.environ["SOURCE_RUN_ID"]
          expected = set(json.loads(os.environ["EXPECTED_ENTRIES"]))
          rows = list(run.glob("*.jsonl"))
          produced = [path.stem for path in rows]
          if len(produced) != len(set(produced)):
              raise SystemExit("Duplicate result rows detected.")
          if set(produced) != expected:
              raise SystemExit(f"Incomplete coverage: expected={sorted(expected)}, produced={sorted(produced)}")
          workspaces = list((run / "artifacts").glob("*-workspace.zip"))
          if len(workspaces) != len(expected):
              raise SystemExit(f"Expected {len(expected)} workspace artifacts, found {len(workspaces)}.")
          PY

      - name: Re-evaluate offered-tool assertions for publication recovery
        if: inputs.publication-source-run-id != ''
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from bcbench.evaluate.bcal_scenario import _offered_tool_assertions

          run = Path(os.environ["EVALUATION_RESULTS_DIR"]) / os.environ["SOURCE_RUN_ID"]
          offered_ids = {
              "variant-offered-tools-complete",
              "variant-activate-skill-offered",
              "variant-activate-skill-not-offered",
              "variant-offered-tool-count",
              "variant-offered-tool-schema-hash",
          }
          for path in run.glob("*.jsonl"):
              rows = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  row = json.loads(line)
                  assertions = [item for item in row["trace_assertions"] if item["assertion_id"] not in offered_ids]
                  trace = row.get("canonical_trace") or {}
                  events = trace.get("events", [])
                  assertions.extend(assertion.model_dump(mode="json") for assertion in _offered_tool_assertions(events))
                  row["trace_assertions"] = assertions
                  row["trace_compliance"] = all(item["passed"] for item in assertions)
                  rows.append(json.dumps(row, separators=(",", ":")))
              path.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Summarize results
        run: uv run bcbench result summarize --run-id "$SOURCE_RUN_ID" --category bcal-scenario --result-dir "$EVALUATION_RESULTS_DIR" --git-ref "${{ needs.validate-selection.outputs.workflow-ref }}"

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluation-summary-${{ inputs.variant }}-r${{ inputs.repetition }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/${{ env.SOURCE_RUN_ID }}/
          retention-days: 30

      - name: Azure Login for Kusto publication
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve evaluator configuration
        id: bceval
        run: uv run bcbench category bceval-config --category bcal-scenario

      - name: Publish judge and metrics
        env:
          BRAINTRUST_PROJECT_ID: ${{ secrets.BRAINTRUST_PROJECT_ID }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          JUDGE_MODEL: gpt-56-ceres
        shell: bash
        run: |
          token="$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)"
          echo "::add-mask::$token"
          uv pip install --python .venv/bin/python "bc-eval==0.6.1" --index "https://anything:${token}@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
          uv run python -m bcbench.agent.bcal.bc_eval_cli metrics calculate \
            --feature-name BC-Bench \
            --eval-suite-name bcal-scenario \
            --eval-run-name "BCal report skill ${{ inputs.variant }} r${{ inputs.repetition }} - #${SOURCE_RUN_ID}" \
            --tags "BCal-external-command,gpt-55-chat,study-${{ needs.validate-selection.outputs.study-id }},variant-${{ inputs.variant }},repetition-${{ inputs.repetition }}-of-2,selector-${{ needs.validate-selection.outputs.selector-sha256 }}" \
            --source "${{ github.sha }}" \
            --input-file "$EVALUATION_RESULTS_DIR/${SOURCE_RUN_ID}/bceval_results.jsonl" \
            --evaluator-definitions "${{ github.workspace }}/evaluator/scores.py" \
            --evaluators "${{ steps.bceval.outputs.evaluators }}" \
            --core-score "${{ steps.bceval.outputs.core_score }}" \
            --metric-definitions "${{ github.workspace }}/evaluator/metrics.py" \
            --metrics bc_bench_metrics \
            --eval-run-type experiment \
            --storage braintrust \
            --storage kusto
