name: Evaluation with bcal
run-name: ${{ inputs.publish-source-run-id && format('Publish source {0} - ', inputs.publish-source-run-id) || '' }}BCal ${{ inputs.tier || 'gold' }}${{ inputs.cohort && format('/{0}', inputs.cohort) || '' }} ${{ inputs.bcal-feed || 'official' }}@${{ inputs.bcal-version || 'latest' }} (${{ inputs.external-model || 'gpt-55-chat' }})${{ inputs.study-id && format(' [{0}/{1}]', inputs.study-id, inputs.variant-id) || '' }} - ${{ inputs.publish-source-run-id && 'publication-only' || (inputs.test-run && 'test' || 'full') }}${{ inputs.repeat-count > 1 && format(' x{0}', inputs.repeat-count) || '' }}
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "NL2AL dataset tier to evaluate"
        required: false
        default: gold
        type: choice
        options:
          - gold
          - challenge
      bcal-feed:
        description: "BCal package feed: official, or the internal test feed for experimental builds"
        required: false
        default: official
        type: choice
        options:
          - official
          - experiment
      bcal-version:
        description: "Exact BCal NuGet version; leave empty for the latest prerelease"
        required: false
        default: ""
        type: string
      external-model:
        description: "Model alias to use through the bc-eval M365 LLM API client"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      cohort:
        description: "Checked-in evaluation cohort name; leave empty for the full selected dataset"
        required: false
        default: ""
        type: string
      repeat-count:
        description: "Number of independent repetitions"
        required: false
        default: 1
        type: number
      study-id:
        description: "Study identifier; requires all study provenance inputs"
        required: false
        default: ""
        type: string
      variant-id:
        description: "Study variant identifier"
        required: false
        default: ""
        type: string
      bcal-common-base-sha:
        description: "Common BCal source base SHA shared by study variants"
        required: false
        default: ""
        type: string
      bcal-variant-patch-sha:
        description: "BCal variant patch SHA"
        required: false
        default: ""
        type: string
      publish-source-run-id:
        description: "Publish immutable artifacts from this prior BCal workflow run without evaluating"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: bcal-evaluation-${{ inputs.publish-source-run-id || 'new-run' }}-${{ inputs.tier || 'gold' }}-${{ inputs.cohort || 'all' }}-${{ inputs.bcal-feed || 'official' }}-${{ inputs.bcal-version || 'latest' }}-${{ inputs.external-model || 'gpt-55-chat' }}-${{ inputs.study-id || 'no-study' }}-${{ inputs.variant-id || 'no-variant' }}-${{ inputs.bcal-common-base-sha || 'no-common-base' }}-${{ inputs.bcal-variant-patch-sha || 'no-variant-patch' }}-${{ inputs.test-run && 'test' || 'full' }}-x${{ inputs.repeat-count || 1 }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  TIER: ${{ inputs.tier || 'gold' }}
  BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}

jobs:
  validate-study:
    if: ${{ inputs.publish-source-run-id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate study provenance
        shell: bash
        env:
          STUDY_ID: ${{ inputs.study-id }}
          VARIANT_ID: ${{ inputs.variant-id }}
          BCAL_COMMON_BASE_SHA: ${{ inputs.bcal-common-base-sha }}
          BCAL_VARIANT_PATCH_SHA: ${{ inputs.bcal-variant-patch-sha }}
        run: |
          values=("$STUDY_ID" "$VARIANT_ID" "$BCAL_COMMON_BASE_SHA" "$BCAL_VARIANT_PATCH_SHA")
          populated=0
          for value in "${values[@]}"; do
            if [[ -n "${value//[[:space:]]/}" ]]; then
              populated=$((populated + 1))
            fi
          done
          if [[ "$populated" -ne 0 && "$populated" -ne 4 ]]; then
            echo "::error::study-id, variant-id, bcal-common-base-sha, and bcal-variant-patch-sha must be nonempty together."
            exit 1
          fi

  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.publish-source-run-id == '' && (inputs.test-run || false) }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}
      cohort: ${{ inputs.cohort || '' }}
      repeat-count: ${{ format('{0}', inputs.repeat-count || 1) }}

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: [validate-study, get-entries]
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: ${{ inputs.publish-source-run-id == '' && needs.validate-study.result == 'success' && needs.get-entries.outputs.entries != '[]' }}
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
        repetition: ${{ fromJson(needs.get-entries.outputs.repetitions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Install bcal CLI from internal feed
        uses: $/.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: ${{ secrets.BCAL_PACKAGE_ID }}
          feed: ${{ inputs.bcal-feed || 'official' }}
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
          version: ${{ env.BCAL_REQUESTED_VERSION }}

      - name: Build bc-eval LLM API bridge venv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        shell: pwsh
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category nl2al --tier "$env:TIER" --github-output version

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category nl2al -Tier "$env:TIER" -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for LLM API certificate Key Vault
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch LLM API client certificate from Key Vault
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CERTIFICATE_KEY_VAULT_NAME -or -not $env:CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set."
          }
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
          BCBENCH_COHORT_NAME: ${{ needs.get-entries.outputs.cohort-name }}
          BCBENCH_COHORT_SHA256: ${{ needs.get-entries.outputs.cohort-sha256 }}
          BCBENCH_REPETITION_INDEX: ${{ (inputs.cohort != '' || inputs.repeat-count > 1) && matrix.repetition || '' }}
          BCBENCH_REPETITION_COUNT: ${{ (inputs.cohort != '' || inputs.repeat-count > 1) && needs.get-entries.outputs.repetition-count || '' }}
          BCBENCH_STUDY_ID: ${{ inputs.study-id }}
          BCBENCH_VARIANT_ID: ${{ inputs.variant-id }}
          BCAL_COMMON_BASE_SHA: ${{ inputs.bcal-common-base-sha }}
          BCAL_VARIANT_PATCH_SHA: ${{ inputs.bcal-variant-patch-sha }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
        shell: pwsh
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          if (-not (Test-Path $env:LLM_API_CERTIFICATE_FILE)) {
            throw "Expected LLM API client cert at $env:LLM_API_CERTIFICATE_FILE but it was not fetched from Key Vault."
          }
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"

          $runId = "$env:GITHUB_RUN_ID"
          if (-not [string]::IsNullOrWhiteSpace($env:BCBENCH_REPETITION_INDEX)) {
            $runId = "$runId-r$env:BCBENCH_REPETITION_INDEX"
          }

          uv run bcbench evaluate bcal "${{ matrix.entry }}" --tier "$env:TIER" --output-dir "$env:EVALUATION_RESULTS_DIR" --run-id "$runId"

      - name: Upload evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}${{ (inputs.cohort != '' || inputs.repeat-count > 1) && format('-r{0}', matrix.repetition) || '' }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: [validate-study, get-entries, evaluate-with-bcal]
    if: ${{ always() && !cancelled() && inputs.publish-source-run-id == '' && needs.validate-study.result == 'success' && needs.get-entries.result == 'success' && needs.get-entries.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJson(needs.get-entries.outputs.repetitions) }}
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      actions: read
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-bcal.outputs.results-dir || 'evaluation_results' }}
      model: ${{ inputs.external-model || 'gpt-55-chat' }}
      agent: BCal-external-command
      mock: ${{ inputs.test-run || false }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}
      experiment: ${{ inputs.bcal-feed == 'experiment' }}
      skip-leaderboard: true
      expected-entries: ${{ needs.get-entries.outputs.entries }}
      allow-incomplete-results: true
      artifact-pattern: evaluation-results-${{ github.run_id }}${{ (inputs.cohort != '' || inputs.repeat-count > 1) && format('-r{0}', matrix.repetition) || '' }}-*
      artifact-suffix: ${{ (inputs.cohort != '' || inputs.repeat-count > 1) && format('-r{0}', matrix.repetition) || '' }}
      evaluation-run-id: ${{ (inputs.cohort != '' || inputs.repeat-count > 1) && format('{0}-r{1}', github.run_id, matrix.repetition) || github.run_id }}
      cohort-name: ${{ needs.get-entries.outputs.cohort-name }}
      cohort-sha256: ${{ needs.get-entries.outputs.cohort-sha256 }}
      repetition-index: ${{ format('{0}', matrix.repetition) }}
      repetition-count: ${{ needs.get-entries.outputs.repetition-count }}
      bcal-feed: ${{ inputs.bcal-feed || 'official' }}
      bcal-version: ${{ inputs.bcal-version || 'latest' }}
      study-id: ${{ inputs.study-id }}
      variant-id: ${{ inputs.variant-id }}
      bcal-common-base-sha: ${{ inputs.bcal-common-base-sha }}
      bcal-variant-patch-sha: ${{ inputs.bcal-variant-patch-sha }}
    secrets: inherit

  publish-existing-results:
    needs: get-entries
    if: ${{ inputs.publish-source-run-id != '' && needs.get-entries.result == 'success' && needs.get-entries.outputs.entries != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        repetition: ${{ fromJson(needs.get-entries.outputs.repetitions) }}
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      actions: read
      contents: write
      id-token: write
    with:
      results-dir: evaluation_results
      model: ${{ inputs.external-model || 'gpt-55-chat' }}
      agent: BCal-external-command
      mock: false
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}
      experiment: ${{ inputs.bcal-feed == 'experiment' }}
      skip-leaderboard: true
      expected-entries: ${{ needs.get-entries.outputs.entries }}
      allow-incomplete-results: true
      artifact-pattern: evaluation-results-${{ inputs.publish-source-run-id }}-r${{ matrix.repetition }}-*
      artifact-suffix: -source-${{ inputs.publish-source-run-id }}-r${{ matrix.repetition }}
      source-workflow-run-id: ${{ inputs.publish-source-run-id }}
      evaluation-run-id: ${{ inputs.publish-source-run-id }}-r${{ matrix.repetition }}
      cohort-name: ${{ needs.get-entries.outputs.cohort-name }}
      cohort-sha256: ${{ needs.get-entries.outputs.cohort-sha256 }}
      repetition-index: ${{ format('{0}', matrix.repetition) }}
      repetition-count: ${{ needs.get-entries.outputs.repetition-count }}
      bcal-feed: ${{ inputs.bcal-feed || 'official' }}
      bcal-version: ${{ inputs.bcal-version || 'latest' }}
      study-id: ${{ inputs.study-id }}
      variant-id: ${{ inputs.variant-id }}
      bcal-common-base-sha: ${{ inputs.bcal-common-base-sha }}
      bcal-variant-patch-sha: ${{ inputs.bcal-variant-patch-sha }}
      git-ref: esbenk-bcal-staged-ablation
    secrets: inherit
