name: Evaluation with bcal
run-name: BCal ${{ inputs.category || 'bcal-scenario' }} ${{ inputs.tier || 'gold' }} ${{ inputs.bcal-feed || 'official' }}@${{ inputs.bcal-version || 'latest' }} (${{ inputs.external-model || 'gpt-55-chat' }}${{ inputs.completion-review-model && inputs.completion-review-model != 'none' && format('/review:{0}', inputs.completion-review-model) || '' }}) - ${{ inputs.test-run && 'test' || 'full' }}${{ (inputs.validation-phase == 'preflight' || inputs.validation-phase == 'smoke') && format(' / stacked-smoke {0}', inputs.validation-phase) || '' }}${{ startsWith(inputs.validation-phase, 'full-gold-legacy') && format(' / legacy-only {0}', inputs.validation-phase) || startsWith(inputs.validation-phase, 'full-gold') && format(' / paired {0}', inputs.validation-phase) || '' }}
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      validation-phase:
        description: "Isolated approved smoke or full-gold pair; ordinary preserves existing evaluation"
        required: false
        default: ordinary
        type: choice
        options:
          - ordinary
          - preflight
          - smoke
          - full-gold-preflight
          - full-gold-none-probe
          - full-gold
          - full-gold-repeat-preflight
          - full-gold-repeat
          - full-gold-legacy-preflight
          - full-gold-legacy
      preflight-run-id:
        description: "Exact successful same-SHA admission run for the selected governed workload"
        required: false
        default: ""
        type: string
      tier:
        description: "Dataset tier to evaluate (challenge is only available for NL2AL)"
        required: false
        default: gold
        type: choice
        options:
          - gold
          - challenge
      category:
        description: "BCal-compatible evaluation category"
        required: false
        default: "bcal-scenario"
        type: choice
        options:
          - "nl2al"
          - "bcal-scenario"
          - "bcal-feature"
      bcal-feed:
        description: "BCal package feed: official, or the internal test feed for experimental builds"
        required: false
        default: official
        type: choice
        options:
          - official
          - experiment
      bcal-version:
        description: "Exact BCal NuGet version; leave empty for the latest prerelease"
        required: false
        default: ""
        type: string
      external-model:
        description: "Model alias to use through the bc-eval M365 LLM API client"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      completion-review-model:
        description: "Separate model for BCal's completion review; none uses external-model"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
      llm-preflight-only:
        description: "Run real external-command model and judge preflights without selecting evaluation entries"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: ${{ startsWith(inputs.validation-phase, 'full-gold-legacy') && 'bcal-full-gold-legacy-utf8-validation1-entry' || startsWith(inputs.validation-phase, 'full-gold-repeat') && 'bcal-full-gold-legacy-diagnostics-repeat1-entry' || startsWith(inputs.validation-phase, 'full-gold') && 'bcal-full-gold-sol-paired-20261113-entry' || (inputs.validation-phase == 'preflight' || inputs.validation-phase == 'smoke') && 'bcal-stacked-sdk-smoke-20261112-entry' || format('bcal-evaluation-{0}-{1}', inputs.category || 'bcal-scenario', inputs.test-run && 'test' || 'full') }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  TIER: ${{ inputs.tier || 'gold' }}
  BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}

jobs:
  governed-validation:
    if: inputs.validation-phase == 'preflight' || inputs.validation-phase == 'smoke' || startsWith(inputs.validation-phase, 'full-gold')
    uses: ./.github/workflows/bcal-governed-policy.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      phase: ${{ inputs.validation-phase }}
      preflight-run-id: ${{ inputs.preflight-run-id }}
    secrets: inherit

  llm-preflight:
    if: ${{ (inputs.validation-phase == '' || inputs.validation-phase == 'ordinary') && (inputs.llm-preflight-only || false) }}
    uses: ./.github/workflows/bcal-llm-preflight.yml
    permissions:
      contents: read
      id-token: write
    with:
      model: gpt-55-chat
    secrets: inherit

  get-entries:
    if: (inputs.validation-phase == '' || inputs.validation-phase == 'ordinary') && !(inputs.llm-preflight-only || false)
    uses: ./.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run || false }}
      category: ${{ inputs.category || 'bcal-scenario' }}
      tier: ${{ inputs.tier || 'gold' }}

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: ./.github/actions/setup-python-uv

      - name: Install bcal CLI from internal feed
        uses: ./.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: ${{ secrets.BCAL_PACKAGE_ID }}
          feed: ${{ inputs.bcal-feed || 'official' }}
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
          version: ${{ env.BCAL_REQUESTED_VERSION }}

      - name: Build bc-eval LLM API bridge venv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        shell: pwsh
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category "${{ inputs.category || 'bcal-scenario' }}" --tier "$env:TIER" --github-output version

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category "${{ inputs.category || 'bcal-scenario' }}" -Tier "$env:TIER" -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for LLM API certificate Key Vault
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch LLM API client certificate from Key Vault
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CERTIFICATE_KEY_VAULT_NAME -or -not $env:CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set."
          }
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
          BCAL_COMPLETION_REVIEW_MODEL: ${{ inputs.completion-review-model != 'none' && inputs.completion-review-model || '' }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
        shell: pwsh
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          if (-not (Test-Path $env:LLM_API_CERTIFICATE_FILE)) {
            throw "Expected LLM API client cert at $env:LLM_API_CERTIFICATE_FILE but it was not fetched from Key Vault."
          }
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"

          uv run bcbench evaluate bcal "${{ matrix.entry }}" --category "${{ inputs.category || 'bcal-scenario' }}" --tier "$env:TIER" --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload evaluation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-bcal
    uses: ./.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-bcal.outputs.results-dir }}
      model: ${{ inputs.external-model || 'gpt-55-chat' }}
      agent: BCal-external-command
      mock: ${{ inputs.test-run || false }}
      category: ${{ inputs.category || 'bcal-scenario' }}
      tier: ${{ inputs.tier || 'gold' }}
      experiment: ${{ inputs.bcal-feed == 'experiment' }}
      skip-leaderboard: true
    secrets: inherit
