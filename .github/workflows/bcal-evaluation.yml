name: Evaluation with bcal
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Azure OpenAI deployment name to use for bcal"
        required: false
        default: "gpt-5.2"
        type: choice
        options:
          - "gpt-5.2"
      llm-backend:
        description: "LLM backend for bcal. In this workflow, external-command uses the bc-eval CAPI bridge."
        required: false
        default: "external-command"
        type: choice
        options:
          - "azure-openai"
          - "external-command"
      external-model:
        description: "Model alias passed to the external-command bridge when llm-backend=external-command"
        required: false
        default: "gpt-55-chat-2026-04-29"
        type: choice
        options:
          - "claude-opus-4-8"
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat-2026-04-29"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: bcal-evaluation-${{ inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  BCCONTAINERHELPER_VERSION: 6.1.18

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run || false }}
      category: nl2al

  prepare-bccontainerhelper:
    runs-on: windows-latest
    needs: get-entries
    if: needs.get-entries.outputs.entries != '[]'
    steps:
      - name: Cache pinned BcContainerHelper
        id: cache-bccontainerhelper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\Documents\PowerShell\Modules\BcContainerHelper
          key: bcal-bccontainerhelper-${{ runner.os }}-${{ env.BCCONTAINERHELPER_VERSION }}

      - name: Install pinned BcContainerHelper with bounded retry
        if: steps.cache-bccontainerhelper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleRoot = Join-Path $HOME 'Documents\PowerShell\Modules'
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          $transientPattern = 'No match was found|429|5\d{2}|temporarily unavailable|timed out|Unable to resolve package source|underlying connection was closed|NameResolutionFailure'

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Save-Module `
                -Name BcContainerHelper `
                -RequiredVersion $env:BCCONTAINERHELPER_VERSION `
                -Repository PSGallery `
                -Path $moduleRoot `
                -Force `
                -ErrorAction Stop
              break
            }
            catch {
              $message = $_.Exception.ToString()
              if ($attempt -eq 3 -or $message -notmatch $transientPattern) {
                throw
              }
              $delay = [Math]::Min(60, 10 * [Math]::Pow(2, $attempt - 1))
              Write-Output "::warning::BcContainerHelper download attempt $attempt failed with a transient dependency error; retrying in ${delay}s"
              Start-Sleep -Seconds $delay
            }
          }

      - name: Verify pinned BcContainerHelper
        shell: pwsh
        run: |
          Import-Module BcContainerHelper -RequiredVersion $env:BCCONTAINERHELPER_VERSION -Force -DisableNameChecking
          if ((Get-Module BcContainerHelper).Version -ne [Version]$env:BCCONTAINERHELPER_VERSION) {
            throw "Expected BcContainerHelper $env:BCCONTAINERHELPER_VERSION."
          }

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: [get-entries, prepare-bccontainerhelper]
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Azure Login (OIDC) for ADO feed
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install Azure Artifacts credential provider
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Artifacts.CredentialProvider.NuGet.Tool

          echo "$HOME\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Install bcal CLI from internal feed
        shell: pwsh
        env:
          BCAL_PACKAGE_ID: ${{ secrets.BCAL_PACKAGE_ID }}
          BCAL_FEED_URL: ${{ secrets.BCAL_FEED_URL }}
        run: |
          # Let native non-zero exits set $LASTEXITCODE instead of throwing, so the retry loop can see them.
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          $endpoints = @{
            endpointCredentials = @(
              @{
                endpoint = $env:BCAL_FEED_URL
                username = "anything"
                password = $adoToken
              }
            )
          } | ConvertTo-Json -Compress -Depth 5
          $env:VSS_NUGET_EXTERNAL_FEED_ENDPOINTS = $endpoints

          # The ADO Artifacts NuGet credential provider intermittently fails to start ("Unable to load
          # the service index for source"), which otherwise fails the entire matrix job and skips the
          # results upload. Retry the transient feed error a couple of times before giving up.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet tool install -g $env:BCAL_PACKAGE_ID --prerelease --add-source $env:BCAL_FEED_URL
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bcal CLI install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bcal CLI install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Build bc-eval CAPI bridge venv
        if: ${{ (inputs.llm-backend || 'external-command') == 'external-command' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-capi-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-capi-venv\Scripts\python.exe "bc-eval[capi]==0.3.14" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval[capi] install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category nl2al --github-output version

      - name: Restore pinned BcContainerHelper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\Documents\PowerShell\Modules\BcContainerHelper
          key: bcal-bccontainerhelper-${{ runner.os }}-${{ env.BCCONTAINERHELPER_VERSION }}
          fail-on-cache-miss: true

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\scripts\Download-BCSymbols.ps1 -Category nl2al -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for CAPI Key Vault
        if: ${{ (inputs.llm-backend || 'external-command') == 'external-command' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch CAPI client certificate from Key Vault
        if: ${{ (inputs.llm-backend || 'external-command') == 'external-command' }}
        shell: pwsh
        env:
          CAPI_CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CAPI_CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CAPI_CERTIFICATE_KEY_VAULT_NAME -or -not $env:CAPI_CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set when llm-backend = external-command."
          }
          $b64 = az keyvault secret show --vault-name $env:CAPI_CERTIFICATE_KEY_VAULT_NAME --name $env:CAPI_CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch CAPI cert from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\capi-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_BACKEND: ${{ inputs.llm-backend || 'external-command' }}
          BCAL_LLM_MODEL: ${{ (inputs.llm-backend || 'external-command') == 'external-command' && (inputs.external-model || 'gpt-55-chat-2026-04-29') || (inputs.model || 'gpt-5.2') }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ inputs.model || 'gpt-5.2' }}
          CAPI_ENDPOINT: ${{ secrets.CAPI_ENDPOINT }}
          CAPI_SCOPE: ${{ secrets.CAPI_SCOPE }}
          CAPI_ORG_GUID: ${{ secrets.CAPI_ORG_GUID }}
          CAPI_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          CAPI_USER_OBJECT_ID: ${{ secrets.CAPI_USER_OBJECT_ID }}
          CAPI_PARTNER_SOURCE: ${{ secrets.CAPI_PARTNER_SOURCE }}
          CAPI_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
          CAPI_CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CAPI_CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
          PYTHONPATH: ${{ github.workspace }}\src
        shell: pwsh
        run: |
          if ("${{ inputs.llm-backend || 'external-command' }}" -eq "external-command") {
            $env:CAPI_CERT_FILE = "$env:RUNNER_TEMP\capi-cert.pfx"
            if (-not (Test-Path $env:CAPI_CERT_FILE)) {
              throw "Expected CAPI client cert at $env:CAPI_CERT_FILE but it was not fetched from Key Vault."
            }
            $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-capi-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_capi_bridge.py"
          }

          uv run bcbench evaluate bcal "${{ matrix.entry }}" --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: [get-entries, evaluate-with-bcal]
    if: ${{ always() && !cancelled() && needs.get-entries.result == 'success' && needs.get-entries.outputs.entry-count != '0' }}
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: evaluation_results
      model: ${{ (inputs.llm-backend || 'external-command') == 'external-command' && (inputs.external-model || 'gpt-55-chat-2026-04-29') || (inputs.model || 'gpt-5.2') }}
      agent: ${{ (inputs.llm-backend || 'external-command') == 'external-command' && 'BCal-external-command' || 'BCal' }}
      mock: ${{ inputs.test-run || false }}
      category: nl2al
      skip-leaderboard: true
      expected-total: ${{ fromJSON(needs.get-entries.outputs.entry-count) }}
      artifact-pattern: evaluation-results-${{ github.run_id }}-${{ github.run_attempt }}-*
    secrets: inherit
