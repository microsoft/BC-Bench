name: Evaluation with bcal
run-name: BCal ${{ inputs.bcal-package-selection == 'experiment-pinned' && format('experiment@{0}', inputs.bcal-version) || inputs.bcal-package-selection == 'official-pinned' && format('official@{0}', inputs.bcal-version) || 'official/latest' }} (${{ inputs.external-model || 'gpt-55-chat' }}) - ${{ inputs.test-run && 'test' || 'full' }}
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      bcal-package-selection:
        description: "BCAL package selection"
        required: false
        default: official-latest
        type: choice
        options:
          - official-latest
          - official-pinned
          - experiment-pinned
      bcal-version:
        description: "Exact BCal NuGet version for pinned selections; leave empty for official-latest"
        required: false
        default: ""
        type: string
      external-model:
        description: "Model alias to use through the bc-eval M365 LLM API client"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: bcal-evaluation-${{ inputs.bcal-package-selection || 'official-latest' }}-${{ inputs.bcal-version || 'latest' }}-${{ inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}

jobs:
  validate-bcal-package:
    runs-on: ubuntu-latest
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      branch: ${{ steps.provenance.outputs.branch || steps.resolve.outputs.branch }}
      feed: ${{ steps.resolve.outputs.feed }}
      version-mode: ${{ steps.resolve.outputs.version-mode }}
    steps:
      - name: Validate and resolve BCal package selection
        id: resolve
        shell: bash
        env:
          PACKAGE_SELECTION: ${{ inputs.bcal-package-selection || 'official-latest' }}
          REQUESTED_VERSION: ${{ inputs.bcal-version }}
          OFFICIAL_FEED_URL: ${{ secrets.BCAL_FEED_URL }}
          EXPERIMENT_FEED_URL: ${{ secrets.BCAL_TEST_FEED_URL }}
        run: |
          set -euo pipefail

          exact_version='^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          case "$PACKAGE_SELECTION" in
            official-latest)
              channel="official"
              version_mode="latest-prerelease"
              ;;
            official-pinned)
              channel="official"
              version_mode="pinned"
              ;;
            experiment-pinned)
              channel="experiment"
              version_mode="pinned"
              ;;
            *)
              echo "::error::Unknown bcal-package-selection: $PACKAGE_SELECTION"
              exit 1
              ;;
          esac

          case "$version_mode" in
            latest-prerelease)
              if [[ -n "$REQUESTED_VERSION" ]]; then
                echo "::error::bcal-version must be empty for official-latest."
                exit 1
              fi
              ;;
            pinned)
              if [[ ! "$REQUESTED_VERSION" =~ $exact_version ]]; then
                echo "::error::Pinned package selections require bcal-version to be an exact NuGet version."
                exit 1
              fi
              ;;
          esac

          if [[ "$OFFICIAL_FEED_URL" != https://* ]]; then
            echo "::error::BCAL_FEED_URL must be a non-empty HTTPS Azure Artifacts URL."
            exit 1
          fi

          case "$channel" in
            official)
              branch="master"
              feed="DynamicsSMBPackages"
              ;;
            experiment)
              if [[ "$EXPERIMENT_FEED_URL" != https://* ]]; then
                echo "::error::BCAL_TEST_FEED_URL must be a non-empty HTTPS Azure Artifacts URL."
                exit 1
              fi
              if [[ "$OFFICIAL_FEED_URL" == "$EXPERIMENT_FEED_URL" ]]; then
                echo "::error::Official and experimental BCAL feed URLs must differ."
                exit 1
              fi
              branch=""
              feed="DynamicsSMBTest@Local"
              ;;
          esac

          echo "source=$channel" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "feed=$feed" >> "$GITHUB_OUTPUT"
          echo "version-mode=$version_mode" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for experimental package provenance
        if: ${{ steps.resolve.outputs.source == 'experiment' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC) for experimental package provenance
        if: ${{ steps.resolve.outputs.source == 'experiment' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify experimental package provenance
        if: ${{ steps.resolve.outputs.source == 'experiment' }}
        id: provenance
        shell: pwsh
        env:
          BCAL_PACKAGE_ID: ${{ secrets.BCAL_PACKAGE_ID }}
          BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}
          BCAL_TEST_FEED_URL: ${{ secrets.BCAL_TEST_FEED_URL }}
        run: |
          .\scripts\Resolve-BCalPackageProvenance.ps1 `
            -PackageId "$env:BCAL_PACKAGE_ID" `
            -Version "$env:BCAL_REQUESTED_VERSION" `
            -TestFeedUrl "$env:BCAL_TEST_FEED_URL"

  get-entries:
    needs: validate-bcal-package
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.test-run || false }}
      category: nl2al

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: [validate-bcal-package, get-entries]
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Install bcal CLI from internal feed
        id: install-bcal
        uses: $/.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: ${{ secrets.BCAL_PACKAGE_ID }}
          feed-url: ${{ needs.validate-bcal-package.outputs.source == 'experiment' && secrets.BCAL_TEST_FEED_URL || secrets.BCAL_FEED_URL }}
          version-mode: ${{ needs.validate-bcal-package.outputs.version-mode }}
          version: ${{ env.BCAL_REQUESTED_VERSION }}

      - name: Build bc-eval LLM API bridge venv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category nl2al --github-output version

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category nl2al -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for LLM API certificate Key Vault
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch LLM API client certificate from Key Vault
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CERTIFICATE_KEY_VAULT_NAME -or -not $env:CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set."
          }
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
          BCAL_PACKAGE_VERSION: ${{ steps.install-bcal.outputs.version }}
          BCAL_PACKAGE_CHANNEL: ${{ needs.validate-bcal-package.outputs.source }}
          BCAL_PACKAGE_BRANCH: ${{ needs.validate-bcal-package.outputs.branch }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BCAL_PACKAGE_VERSION)) {
            throw "The installed BCal package version was not reported."
          }
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          if (-not (Test-Path $env:LLM_API_CERTIFICATE_FILE)) {
            throw "Expected LLM API client cert at $env:LLM_API_CERTIFICATE_FILE but it was not fetched from Key Vault."
          }
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"

          uv run bcbench evaluate bcal "${{ matrix.entry }}" --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"

      - name: Upload evaluation results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: [validate-bcal-package, evaluate-with-bcal]
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-bcal.outputs.results-dir }}
      model: ${{ inputs.external-model || 'gpt-55-chat' }}
      agent: BCal-external-command
      mock: ${{ inputs.test-run || false }}
      category: nl2al
      bcal-package-channel: ${{ needs.validate-bcal-package.outputs.source }}
      bcal-package-branch: ${{ needs.validate-bcal-package.outputs.branch }}
      bcal-package-feed: ${{ needs.validate-bcal-package.outputs.feed }}
      skip-leaderboard: true
    secrets: inherit
