name: Evaluation with bcal
run-name: BCal ${{ inputs.tier || 'gold' }} ${{ inputs.bcal-feed || 'official' }}@${{ inputs.bcal-version || 'latest' }} [${{ inputs.agent-runtime || 'legacy' }}] (${{ inputs.agent-runtime == 'copilot-sdk' && inputs.sdk-model || inputs.external-model || 'gpt-55-chat' }}${{ inputs.completion-review-model && inputs.completion-review-model != 'none' && format('/review:{0}', inputs.completion-review-model) || '' }}) - ${{ inputs.test-run && 'test' || 'full' }}
permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "NL2AL dataset tier to evaluate"
        required: false
        default: gold
        type: choice
        options:
          - gold
          - challenge
      bcal-feed:
        description: "BCal package feed: official, or the internal test feed for experimental builds"
        required: false
        default: official
        type: choice
        options:
          - official
          - experiment
      bcal-version:
        description: "Exact BCal NuGet version; leave empty for the latest prerelease"
        required: false
        default: ""
        type: string
      agent-runtime:
        description: "BCal orchestration runtime; SDK evaluations require an exact SDK-enabled package version"
        required: false
        default: legacy
        type: choice
        options:
          - legacy
          - copilot-sdk
      sdk-model:
        description: "Explicit main Responses wire model; external-model remains the auxiliary model"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      sdk-reasoning-effort:
        description: "Main SDK reasoning effort; default leaves the model/runtime default unchanged"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "none"
          - "low"
          - "medium"
          - "high"
          - "xhigh"
          - "max"
      sdk-max-model-requests:
        description: "SDK upstream HTTP admission cap, including retries/compaction; not tool calls"
        required: false
        default: 64
        type: number
      sdk-timeout-seconds:
        description: "SDK deadline in seconds, shorter than Bench's 1500-second process timeout"
        required: false
        default: 1200
        type: number
      external-model:
        description: "Legacy main / SDK auxiliary model through the bc-eval M365 LLM API client"
        required: false
        default: "gpt-55-chat"
        type: choice
        options:
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      completion-review-model:
        description: "Separate model for BCal's completion review; none uses external-model"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "gpt-56-reasoning-nano-luna"
          - "gpt-56-reasoning-sol"
          - "gpt-55-chat"
      test-run:
        description: "Indicate this is a test run (with few entries)"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 3 * * 0"


concurrency:
  group: bcal-evaluation-${{ inputs.test-run && 'test' || 'full' }}
  cancel-in-progress: false

env:
  EVALUATION_RESULTS_DIR: evaluation_results
  TIER: ${{ inputs.tier || 'gold' }}
  BCAL_REQUESTED_VERSION: ${{ inputs.bcal-version }}
  BCAL_AGENT_RUNTIME: ${{ inputs.agent-runtime || 'legacy' }}

jobs:
  get-entries:
    uses: $/.github/workflows/get-entries.yml
    with:
      test-run: ${{ inputs.agent-runtime == 'copilot-sdk' || inputs.test-run || false }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}

  evaluate-with-bcal:
    runs-on: windows-latest
    needs: get-entries
    outputs:
      results-dir: ${{ env.EVALUATION_RESULTS_DIR }}
    if: needs.get-entries.outputs.entries != '[]'
    environment:
      name: ado-read
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: ${{ matrix.entry }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.agent-runtime == 'copilot-sdk' && 4 || 32 }}
      matrix:
        entry: ${{ fromJson(needs.get-entries.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python with UV
        uses: $/.github/actions/setup-python-uv

      - name: Validate explicit SDK package selection
        if: inputs.agent-runtime == 'copilot-sdk'
        env:
          SDK_SMOKE_RUN: ${{ inputs.test-run }}
        shell: pwsh
        run: |
          if ($env:SDK_SMOKE_RUN -ne "true") {
            throw "SDK workflow dispatch is smoke-only. Use an approved fixed-entry/repeat manifest for a bounded pilot; full-dataset SDK runs are not enabled."
          }
          if ($env:BCAL_REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "copilot-sdk requires an exact SDK-enabled BCAL package version, not latest or a version range."
          }

      - name: Install bcal CLI from internal feed
        uses: $/.github/actions/install-bcal
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          package-id: ${{ secrets.BCAL_PACKAGE_ID }}
          feed: ${{ inputs.bcal-feed || 'official' }}
          official-feed-url: ${{ secrets.BCAL_FEED_URL }}
          experiment-feed-url: ${{ secrets.BCAL_TEST_FEED_URL }}
          version: ${{ env.BCAL_REQUESTED_VERSION }}

      - name: Build bc-eval LLM API bridge venv
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $adoToken = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
          Write-Output "::add-mask::$adoToken"

          # Match the bridge runtime to BC-Bench so BCal can safely inherit its Python environment.
          uv venv .bcal-llm-api-venv --python .\.venv\Scripts\python.exe

          # Same transient ADO feed flakiness as the bcal install above; retry the package pull.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            uv pip install --python .\.bcal-llm-api-venv\Scripts\python.exe "bc-eval==0.6.1" --index "https://anything:$($adoToken)@dynamicssmb2.pkgs.visualstudio.com/1fcb79e7-ab07-432a-a3c6-6cf5a88ba4a5/_packaging/BC_PythonFeed/pypi/simple/"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "bc-eval install failed after 3 attempts (exit code $LASTEXITCODE)." }
            Write-Output "::warning::bc-eval install attempt $attempt failed (exit $LASTEXITCODE); retrying in 20s"
            Start-Sleep -Seconds 20
          }

      - name: Resolve BC version for cache key
        id: bcversion
        shell: pwsh
        run: uv run bcbench dataset version "${{ matrix.entry }}" --category nl2al --tier "$env:TIER" --github-output version

      # Cache BcContainerHelper's artifact folder (its hardcoded default path) keyed by this entry's BC version
      - name: Cache BC sandbox artifacts
        id: bccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\bcartifacts.cache
          key: bcartifacts-${{ steps.bcversion.outputs.version }}

      - name: Download BC Application symbols
        if: steps.bccache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module -Name BcContainerHelper -Force -AllowClobber -AllowPrerelease
          .\scripts\Download-BCSymbols.ps1 -Category nl2al -Tier "$env:TIER" -InstanceId "${{ matrix.entry }}"

      - name: Azure Login (OIDC) for LLM API certificate Key Vault
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Fetch LLM API client certificate from Key Vault
        shell: pwsh
        env:
          CERTIFICATE_KEY_VAULT_NAME: ${{ secrets.CAPI_CERTIFICATE_KEY_VAULT_NAME }}
          CERTIFICATE_NAME: ${{ secrets.CAPI_CERTIFICATE_NAME }}
        run: |
          if (-not $env:CERTIFICATE_KEY_VAULT_NAME -or -not $env:CERTIFICATE_NAME) {
            throw "CAPI_CERTIFICATE_KEY_VAULT_NAME / CAPI_CERTIFICATE_NAME secrets must be set."
          }
          $b64 = az keyvault secret show --vault-name $env:CERTIFICATE_KEY_VAULT_NAME --name $env:CERTIFICATE_NAME --query value -o tsv
          if (-not $b64) {
            throw "Failed to fetch LLM API client certificate from Key Vault."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\llm-api-cert.pfx", [Convert]::FromBase64String($b64))

      - name: Run BCal for entry ${{ matrix.entry }}
        timeout-minutes: 28
        env:
          BCAL_LLM_MODEL: ${{ inputs.external-model || 'gpt-55-chat' }}
          BCAL_COMPLETION_REVIEW_MODEL: ${{ inputs.completion-review-model != 'none' && inputs.completion-review-model || '' }}
          LLM_API_TENANT_ID: ${{ secrets.CAPI_TENANT_ID }}
          LLM_API_CLIENT_ID: ${{ secrets.CAPI_CLIENT_ID }}
          REQUESTED_SDK_MODEL: ${{ inputs.sdk-model || 'gpt-55-chat' }}
          REQUESTED_SDK_REASONING_EFFORT: ${{ inputs.sdk-reasoning-effort || 'default' }}
          REQUESTED_SDK_MAX_MODEL_REQUESTS: ${{ inputs.sdk-max-model-requests }}
          REQUESTED_SDK_TIMEOUT_SECONDS: ${{ inputs.sdk-timeout-seconds }}
          BCAL_INFERENCE_PROVIDER: bc-eval-m365-test@0.6.1
          BCAL_LLM_PROVIDER: bc-eval-m365-test@0.6.1
          BCAL_LLM_WIRE_API: chat-completions
          LLM_API_ENVIRONMENT: TEST
        shell: pwsh
        run: |
          $env:LLM_API_CERTIFICATE_FILE = "$env:RUNNER_TEMP\llm-api-cert.pfx"
          if (-not (Test-Path $env:LLM_API_CERTIFICATE_FILE)) {
            throw "Expected LLM API client cert at $env:LLM_API_CERTIFICATE_FILE but it was not fetched from Key Vault."
          }
          $env:BCAL_LLM_COMMAND = "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe $env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_llm_api_bridge.py"

          $proxy = $null
          $readyFile = "$env:RUNNER_TEMP\bcal-sdk-ready.json"
          # SDK flags must not affect scheduled or manually selected legacy runs.
          $sdkModel = $env:REQUESTED_SDK_MODEL
          try {
            if ($env:BCAL_AGENT_RUNTIME -eq "copilot-sdk") {
              $env:BCAL_SDK_MODEL = $sdkModel
              $env:BCAL_SDK_MAX_MODEL_REQUESTS = $env:REQUESTED_SDK_MAX_MODEL_REQUESTS
              $env:BCAL_SDK_TIMEOUT_SECONDS = $env:REQUESTED_SDK_TIMEOUT_SECONDS
              if ($env:REQUESTED_SDK_REASONING_EFFORT -ne "default") {
                $env:BCAL_SDK_REASONING_EFFORT = $env:REQUESTED_SDK_REASONING_EFFORT
              }
              $env:BCAL_SDK_PROVIDER = "openai"
              $env:BCAL_SDK_API_KEY_ENV = "BCAL_SDK_PROXY_KEY"
              $env:BCAL_SDK_PROXY_KEY = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
              Write-Output "::add-mask::$env:BCAL_SDK_PROXY_KEY"
              New-Item -ItemType Directory -Force "$env:EVALUATION_RESULTS_DIR\sdk-provider" | Out-Null
              Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
              $proxyArgs = @(
                "$env:GITHUB_WORKSPACE\src\bcbench\agent\bcal\bc_eval_sdk_proxy.py",
                "--model", $sdkModel, "--wire-api", "responses", "--ready-file", $readyFile
              )
              $proxy = Start-Process "$env:GITHUB_WORKSPACE\.bcal-llm-api-venv\Scripts\python.exe" `
                -ArgumentList $proxyArgs -PassThru -NoNewWindow `
                -RedirectStandardOutput "$env:EVALUATION_RESULTS_DIR\sdk-provider\stdout.log" `
                -RedirectStandardError "$env:EVALUATION_RESULTS_DIR\sdk-provider\stderr.log"
              for ($attempt = 0; $attempt -lt 60 -and -not (Test-Path -LiteralPath $readyFile); $attempt++) {
                if ($proxy.HasExited) { throw "SDK inference provider exited before readiness; inspect provider diagnostics." }
                Start-Sleep -Milliseconds 500
              }
              if (-not (Test-Path -LiteralPath $readyFile)) { throw "SDK inference provider did not become ready." }
              $ready = Get-Content -LiteralPath $readyFile -Raw | ConvertFrom-Json
              $health = Invoke-RestMethod "$($ready.base_url)/health" -Headers @{ Authorization = "Bearer $env:BCAL_SDK_PROXY_KEY" } -TimeoutSec 5
              if ($health.status -ne "ready") { throw "SDK inference provider health check failed." }
              $env:BCAL_SDK_BASE_URL = "$($ready.base_url)/v1"
            }
            uv run bcbench evaluate bcal "${{ matrix.entry }}" --tier "$env:TIER" --output-dir "${{ env.EVALUATION_RESULTS_DIR }}"
            if ($LASTEXITCODE -ne 0) { throw "BCal evaluation failed (exit $LASTEXITCODE)." }
          } finally {
            if ($proxy -and -not $proxy.HasExited) { Stop-Process -Id $proxy.Id -Force }
            Remove-Item -LiteralPath $readyFile -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\BCAL_SDK_PROXY_KEY -ErrorAction SilentlyContinue
          }

      - name: Remove staged evaluation certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\llm-api-cert.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload evaluation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evaluation-results-${{ github.run_id }}-${{ matrix.entry }}
          path: |
            ${{ env.EVALUATION_RESULTS_DIR }}/**/*.jsonl
            ${{ env.EVALUATION_RESULTS_DIR }}/**/*.bcal/**
            ${{ env.EVALUATION_RESULTS_DIR }}/sdk-provider/*.log
          retention-days: ${{ inputs.test-run && 1 || 30 }}

  summarize-results:
    needs: evaluate-with-bcal
    uses: $/.github/workflows/summarize-results.yml
    permissions:
      contents: write
      id-token: write
    with:
      results-dir: ${{ needs.evaluate-with-bcal.outputs.results-dir }}
      model: ${{ inputs.agent-runtime == 'copilot-sdk' && inputs.sdk-model || inputs.external-model || 'gpt-55-chat' }}
      agent: ${{ inputs.agent-runtime == 'copilot-sdk' && 'BCal-copilot-sdk' || 'BCal-external-command' }}
      mock: ${{ inputs.test-run || false }}
      category: nl2al
      tier: ${{ inputs.tier || 'gold' }}
      experiment: ${{ inputs.bcal-feed == 'experiment' }}
      skip-leaderboard: true
    secrets: inherit
