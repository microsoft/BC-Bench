name: Install Agent Harnesses
description: Install the agent harnesses used by the evaluation workflows

inputs:
  engine-sha:
    description: Full BC-ALAgents commit SHA (blank uses the default pin)
    required: false
    default: ""

outputs:
  bc-alagents-path:
    description: Path to the pinned BC-ALAgents checkout
    value: ${{ steps.bc-alagents-path.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Validate BC-ALAgents revision
      id: engine-sha
      shell: pwsh
      env:
        ENGINE_SHA: ${{ inputs.engine-sha || '25817a39a67b9e883f1a8ea9624283ab2b41af9b' }}
      run: |
        if ($env:ENGINE_SHA -notmatch '\A[0-9a-fA-F]{40}\z') {
          throw "engine-sha must be a full 40-character hexadecimal commit SHA."
        }
        "sha=$env:ENGINE_SHA" >> $env:GITHUB_OUTPUT

    - name: Install Claude Code
      run: npm install -g @anthropic-ai/claude-code@2.1.221
      shell: pwsh

    - name: Install GitHub Copilot CLI
      shell: pwsh
      run: |
        $env:BCBENCH_COPILOT_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'bcbench-copilot-1.0.88'
        npm install --prefix $env:BCBENCH_COPILOT_INSTALL_ROOT --no-save --package-lock=false --no-audit --no-fund @github/copilot@1.0.88
        if ($LASTEXITCODE -ne 0) { throw 'Pinned Copilot installation failed.' }

        $resolveNative = @'
        const { createRequire } = require('node:module');
        const { join } = require('node:path');
        const localRequire = createRequire(join(process.env.BCBENCH_COPILOT_INSTALL_ROOT, 'package.json'));
        const platform = process.platform === 'linux' && localRequire('detect-libc').isNonGlibcLinuxSync() ? 'linuxmusl' : process.platform;
        console.log(localRequire.resolve(`@github/copilot-${platform}-${process.arch}`));
        '@
        $native = node -e $resolveNative
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $native -PathType Leaf)) {
          throw 'Pinned Copilot native executable could not be resolved.'
        }
        $banner = @(& $native --no-auto-update --version)
        if ($LASTEXITCODE -ne 0 -or $banner -cnotcontains 'GitHub Copilot CLI 1.0.88.') {
          throw "Unexpected pinned Copilot version: $($banner -join ' | ')"
        }
        # The engine resolves copilot.exe before npm's shim on Windows.
        (Split-Path -Parent $native) >> $env:GITHUB_PATH
        'COPILOT_AUTO_UPDATE=false' >> $env:GITHUB_ENV

    - name: Checkout BC-ALAgents
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: microsoft/BC-ALAgents
        ref: ${{ steps.engine-sha.outputs.sha }}
        path: .agent-harnesses/bc-alagents
        persist-credentials: false

    - name: Export BC-ALAgents path
      id: bc-alagents-path
      run: '"path=$(Join-Path $env:GITHUB_WORKSPACE ''.agent-harnesses/bc-alagents'')" >> $env:GITHUB_OUTPUT'
      shell: pwsh
