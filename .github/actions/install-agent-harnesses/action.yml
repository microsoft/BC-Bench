name: Install Agent Harnesses
description: Install the agent harnesses used by the evaluation workflows

inputs:
  copilot-version:
    description: Exact Copilot CLI version (experiment-specific override)
    required: false
    default: "1.0.82"
  engine-sha:
    description: Full BC-ALAgents commit SHA (blank uses the default pin)
    required: false
    default: ""

outputs:
  bc-alagents-path:
    description: Path to the pinned BC-ALAgents checkout
    value: ${{ steps.bc-alagents-path.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Validate BC-ALAgents revision
      id: engine-sha
      shell: pwsh
      env:
        ENGINE_SHA: ${{ inputs.engine-sha || 'ecf8e31759d6ddd6d78e3a0b7836b40134368009' }}
      run: |
        if ($env:ENGINE_SHA -notmatch '\A[0-9a-fA-F]{40}\z') {
          throw "engine-sha must be a full 40-character hexadecimal commit SHA."
        }
        "sha=$env:ENGINE_SHA" >> $env:GITHUB_OUTPUT

    - name: Install Claude Code
      run: npm install -g @anthropic-ai/claude-code@2.1.221
      shell: pwsh

    - name: Install GitHub Copilot CLI
      env:
        COPILOT_VERSION: ${{ inputs.copilot-version }}
      run: |
        if ($env:COPILOT_VERSION -notmatch '\A\d+\.\d+\.\d+\z') {
          throw "copilot-version must be an exact semantic release."
        }
        npm install -g "@github/copilot@$env:COPILOT_VERSION"
      shell: pwsh

    - name: Checkout BC-ALAgents
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        repository: microsoft/BC-ALAgents
        ref: ${{ steps.engine-sha.outputs.sha }}
        path: .agent-harnesses/bc-alagents
        persist-credentials: false

    - name: Export BC-ALAgents path
      id: bc-alagents-path
      run: '"path=$(Join-Path $env:GITHUB_WORKSPACE ''.agent-harnesses/bc-alagents'')" >> $env:GITHUB_OUTPUT'
      shell: pwsh
