name: Prepare governed BCAL policy study
description: No-model exact-package, certificate and frozen-symbol admission
inputs:
  azure-client-id:
    required: true
    description: Existing ado-read identity
  azure-tenant-id:
    required: true
    description: Existing ado-read tenant
  official-feed-url:
    required: true
    description: Existing official package feed
  experiment-feed-url:
    required: true
    description: Existing internal experiment feed
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-python-uv
    - id: package
      shell: pwsh
      run: |
        if ($env:BCAL_STUDY_PROFILE -notin @('bcal-sdk-policy', 'bcal-full-gold', 'bcal-full-gold-repeat', 'bcal-full-gold-legacy-utf8', 'bcal-full-gold-judge-diagnostics')) { throw 'Unknown governed study profile.' }
        $study = Get-Content "experiments\$env:BCAL_STUDY_PROFILE\study.json" -Raw | ConvertFrom-Json
        if ($env:BCAL_STUDY_PROFILE -in @('bcal-full-gold-repeat', 'bcal-full-gold-legacy-utf8', 'bcal-full-gold-judge-diagnostics')) {
          if (!$study.package.version) { throw 'Repeat diagnostic package is not admitted; never install latest implicitly.' }
          .\.venv\Scripts\python.exe .\scripts\bcal_governed_study.py runtime-proofs
          if ($LASTEXITCODE -ne 0) { throw 'Actual repeat runtime proofs have not passed.' }
        }
        "version=$($study.package.version)" >> $env:GITHUB_OUTPUT
    - uses: ./.github/actions/install-bcal
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        package-id: Microsoft.BusinessCentral.BCal.CLI
        feed: experiment
        version: ${{ steps.package.outputs.version }}
        official-feed-url: ${{ inputs.official-feed-url }}
        experiment-feed-url: ${{ inputs.experiment-feed-url }}
    - shell: pwsh
      run: .\scripts\Setup-BCalGovernedStudy.ps1
