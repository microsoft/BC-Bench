name: Setup Python with UV
description: Install UV, setup Python, and install bcbench package

inputs:
  full-install:
    description: "Install all dependency groups (analysis) and extras (redteam) on top of the default dev group"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        version: "0.12.19"
        enable-cache: true

    - name: Setup Python
      run: uv python install
      shell: pwsh

    - name: Install bcbench package
      run: uv sync ${{ inputs.full-install == 'true' && '--all-groups --all-extras' || '' }}
      shell: pwsh
