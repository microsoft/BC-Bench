name: Setup Python with UV
description: Install UV, setup Python, and install bcbench package

inputs:
  all-groups:
    description: "Install all dependency groups (analysis, redteam) on top of the default dev group"
    required: false
    default: "false"
  install-python:
    description: "Install a uv-managed Python runtime instead of using Python already on PATH"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        version: "0.11.7"
        enable-cache: true

    - name: Setup Python
      if: inputs.install-python == 'true'
      run: uv python install
      shell: pwsh

    - name: Install bcbench package
      run: |
        $arguments = @("sync")
        if ("${{ inputs.all-groups }}" -eq "true") {
          $arguments += "--all-groups"
        }
        if ("${{ inputs.install-python }}" -ne "true") {
          $arguments += @("--python", (Get-Command python -ErrorAction Stop).Source)
        }
        uv @arguments
        if ($LASTEXITCODE -ne 0) { throw "uv sync failed ($LASTEXITCODE)." }
      shell: pwsh
