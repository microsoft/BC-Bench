name: Setup Python with UV
description: Install UV, setup Python, and install bcbench package

inputs:
  all-groups:
    description: "Install all dependency groups (analysis, redteam) on top of the default dev group"
    required: false
    default: "false"
  uv-version:
    description: "UV version to install; leave empty to resolve from project configuration or use latest"
    required: false
    default: "0.11.7"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Setup Python
      run: uv python install
      shell: pwsh

    - name: Install bcbench package
      run: uv sync ${{ inputs.all-groups == 'true' && '--all-groups' || '' }}
      shell: pwsh
