# BC-ALAgents review engine settings (the code-review agent).
#
# BC-Bench evaluates the code-review category exclusively through the engine's own
# generate half (Invoke-PRReviewShell.ps1 -GenerateOnly) in local mode, so it measures
# the real PROD engine + BCQuality instead of a bespoke review prompt. This file is
# engine-owned on purpose: nothing here belongs in the shared agent config.
#   path:          absolute path to a local microsoft/BC-ALAgents checkout (override with
#                  the BC_REVIEW_ENGINE_ROOT env var).
#   agent_version: value for COPILOT_REVIEW_AGENT_VERSION; "0.0.0" avoids the engine's
#                  git-tag version lookup (BC-Bench is not a tagged engine release).
#   min_severity:  AGENT_MINIMUM_SEVERITY floor (Low is strictest / emits the most).
path: "C:/depot/BC-ALReviewAgent"
agent_version: "0.0.0"
min_severity: "Low"
# BCQuality content source for the engine run. All optional; null = use the engine's
# pinned repo/ref. Set local_path to iterate on a local BCQuality checkout without
# pushing (it is copied and filtered; the original is never modified). CLI flags
# (--bcquality-repo/-ref/-local-path) override these.
bcquality:
  repo: null        # BCQUALITY_REPO override (e.g. a private fork)
  ref: null         # BCQUALITY_REF override (e.g. your private branch/tag/sha)
  local_path: null  # local BCQuality checkout to copy+filter instead of fetching
