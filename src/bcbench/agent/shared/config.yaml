judges:
  code-review:
    model: "gpt-5.3-codex"
  lm-checklist:
    model: "gpt-41-2025-04-14"

prompt:
  include_project_paths: false

  # Input mode for test generation: "problem-statement", "gold-patch", or "both"
  # - problem-statement: Agent reads bug description, generates tests to reproduce issue => Test driven development
  # - gold-patch: Agent sees fixed code, generates tests to verify fix works             => Test verification for known fixes
  # - both: Agent sees both the bug description and the fixed code                       => Combined context for test generation
  test-generation-input: "both"

  bug-fix-template: |
    You are working with a Business Central (AL) code repository at {{repo_path}}.

    Task: Fix the issue described below {% if include_project_paths %}in the following projects: {{project_paths}}{% endif %}

    Important constraints:
    - Do NOT modify any testing logic or test files
    - Focus solely on fixing the reported issue
    {% if not al_mcp %}
    - Do NOT try to build or run tests, just provide the code changes needed
    {% endif %}
    - Do NOT commit any changes to the repository
    - Focus on W1 localization, do NOT worry about other localizations (e.g. DK, APAC)

    Issue details:
    {{task}}

  test-generation-template: |
    You are working with a Business Central (AL) code repository at {{repo_path}}.
    {% if is_gold_patch and is_problem_statement %}
    Task: Generate ONE NEW test case that reproduce the issue described below {% if include_project_paths %}in the following projects: {{project_paths}}{% endif %}
      The fix has already been applied as local unstaged changes. Write a test that passes with this fix and would fail without it.
    {% elif is_gold_patch %}
    Task: Generate ONE NEW test case that verifies the unstaged changes in *.al files {% if include_project_paths %}in the following projects: {{project_paths}}{% endif %}
      The fix has already been applied as local unstaged changes. Write a test that passes with this fix and would fail without it.
    {% else %}
    Task: Generate ONE NEW test case that reproduce the issue described below {% if include_project_paths %}in the following projects: {{project_paths}}{% endif %}
      The tests should fail against the current codebase (unfixed) and should pass once the issue is fixed.
    {% endif %}

    Important constraints:
    - Do NOT modify any production code or existing tests
    - Focus solely on generating tests {% if is_gold_patch %}that verify the fix works correctly{% else %}for the reported issue{% endif %}
    {% if not al_mcp %}
    - Do NOT try to build or run tests, just provide the code changes needed
    {% endif %}
    - Do NOT commit any changes to the repository
    - Focus on W1 localization, do NOT worry about other localizations (e.g. DK, APAC)
    {% if is_problem_statement %}
    Issue details:
    {{task}}
    {% endif %}

  extensibility-request-implement-template: |
    You are working with a Business Central (AL) code repository at {{repo_path}}.

    Task: Implement the extensibility request described below {% if include_project_paths %}in the following projects: {{project_paths}}{% endif %}

    Important constraints:
    {% if not al_mcp %}
    - Do NOT try to build or run tests, just provide the code changes needed
    {% endif %}
    - Do NOT commit any changes, and do NOT open a pull request

    Extensibility request:
    {{task}}

  extensibility-request-advisor-template: |
    Analyze this complete Business Central extensibility scenario against the AL source at {{repo_path}}.
    Follow your advisor procedure and write the required offline result to `advisor_result.json`.

    Extensibility scenario:
    {{task}}

  extensibility-request-triage-template: |
    You are triaging a single Business Central extensibility request. The standard AL source is checked out at {{repo_path}}.

    Task: Triage the extensibility request below and produce your triage decision (managed labels, advisory comment, and open/closed state).

    Important constraints:
    - This runs offline: read the request from the text below, do NOT call `gh` or touch any live issue.
    - Do NOT build or run tests; base codebase analysis on the local `.al` files under {{repo_path}}.
    - Write your final decision as valid JSON to `triage_result.json` in {{repo_path}}, containing exactly the Step 7 `Final_Output` object. Do not apply it through any host tool.

    Extensibility request:
    {{task}}

  code-review-template: |
    You are reviewing a Business Central (AL) code repository at {{repo_path}}.

    Review only the staged and unstaged dataset changes in the working tree (`git diff HEAD`). Do not compare commits such as HEAD~1..HEAD or origin/main.

    Important constraints:
    - Do NOT modify source code, tests, configuration, or any other repository content.
    - The only file you may create or update is `{{repo_path}}/review.json`.
    - You MUST write `review.json` before finishing; otherwise the review counts as missing output.

    `review.json` must contain one JSON array. Each finding must be an object with these fields:
      - `file`: repository-relative `.al` or `.json` path (string, required)
      - `line_start`: 1-based line where the issue starts (positive integer, required)
      - `line_end`: 1-based line where the issue ends (positive integer, optional)
      - `domain`: review domain (string, optional)
      - `body`: concise description of the issue (non-empty string, required)
      - `severity`: one of `critical`, `high`, `medium`, or `low` (optional)

    If there are no findings, write an empty array. Write only valid JSON to `review.json`, with no surrounding object, Markdown fence, or commentary.

# controls:
# 1. whether to copy custom instructions from `src/bcbench/agent/shared/instructions/<sanitized-repo>/`
#    - Copilot: copies to repo/.github/ and renames AGENTS.md to copilot-instructions.md
#    - Claude: copies to repo/.claude/ and renames AGENTS.md to CLAUDE.md
# 2. whether to pass --disable-custom-instructions to copilot
# NOTE: this will copy any files in the instructions/<sanitized-repo>/ folder, including skills and custom agents
# NOTE: the canonical source file is AGENTS.md; it is automatically renamed
#       to the agent-specific filename (AgentHarness.instruction_filename) during setup
instructions:
  enabled: false

# controls:
# 1. whether to copy skills from `src/bcbench/agent/shared/instructions/<sanitized-repo>/skills/`
#    - Copilot: copies to repo/.github/skills/
#    - Claude: copies to repo/.claude/skills/
skills:
  enabled: false

# controls:
# 1. whether to copy custom agents from `src/bcbench/agent/shared/instructions/<sanitized-repo>/agents/`
#    - Copilot: copies to repo/.github/agents/
#    - Claude: copies to repo/.claude/agents/
# 2. whether to pass --agent=<agent-name> to copilot or claude
agents:
  enabled: false
  name: ALTest

# controls loading agent plugins for the run, only enabled entries are validated and loaded.
# Each plugin gets its own entry, and is passed to the CLI via `--plugin-dir` (session-scoped).
#   name:     plugin name; also how it is recorded on the result as "<name>@<revision|local>"
#   enabled:  per-entry toggle (defaults to false)
#   grant_dir_access: grant the agent read+write access to this plugin's tree via --add-dir (defaults to false)
#   source:   "local" (a folder on this machine) or "github" (cloned at runtime)
#   path:     plugin root - for local an absolute path ; for github relative to the clone ("." for its root, or a subfolder when the repo hosts several plugins)
#   repo:     github only, "owner/repo"
#   revision: github only, a commit SHA (pinned)
plugins:
  - name: "bcbench-example"
    enabled: false
    source: local
    path: "C:/depot/BC-Bench/src/bcbench/agent/shared/plugins/bcbench-example"
  - name: "superpowers"
    enabled: false
    source: github
    repo: "obra/superpowers"
    revision: "d884ae04edebef577e82ff7c4e143debd0bbec99"
    path: "."
  - name: "BCQuality"
    enabled: false
    # grant_dir_access gives BCQuality's skill --add-dir access to read its own knowledge files at
    # runtime. This is a (hopefully temporary) design that may change once that content is served
    # via skills / an MCP server instead.
    grant_dir_access: false
    source: github
    repo: "microsoft/BCQuality"
    revision: "ad8ccde5953fd6ce072e3b59049406783066ed60"
    path: "."

mcp:
  servers:
    # AL MCP server (toggled via --al-mcp CLI flag), https://www.nuget.org/packages/Microsoft.Dynamics.BusinessCentral.Development.Tools
    # NOTE: --assemblyprobingpaths are injected programmatically by mcp.py (requires runtime detection)
    - name: "altool"
      type: "stdio"
      command: "al"
      args:
        [
          "launchmcpserver",
          "--transport",
          "stdio",
          "--packagecachepath",
          "{{package_cache_path}}",
        ]

    # - name: "mslearn"
    #   type: "http"
    #   url: "https://learn.microsoft.com/api/mcp"

    # - name: "filesystem"
    #   type: "stdio"
    #   command: "npx"
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "{{repo_path}}"]

# BC-ALAgents review engine settings for the dedicated pr-review runner. This runner uses
# the production orchestrator's complete local, non-posting path to measure BC PR Review
# + BCQuality on the code-review category, including production parsing and filtering.
# Generic Copilot and Claude runners use code-review-template above on the same category.
# Dirty engine checkouts and local BCQuality paths are for smoke tests only.
# Full comparison runs require clean commits available remotely.
# BCQuality repo/ref remain experiment settings; repo supports testing forks while null values
# use the engine's pinned content source. CLI flags override these values.
pr_review:
  min_severity: Medium
  bcquality:
    repo: null
    ref: null
