general_implementation:
  description: "Implementation rules that apply to all request types"

  rules:
    - id: variable_declaration_order
      applies_to: ["all"]
      severity: "notice"
      description: "Local and global variables must follow the standard AL type-group order"
      action: "internal_warning"
      rule: "Place newly introduced variables in this type-group order: Record; RecordRef and FieldRef; Codeunit; Enum; other complex types; Code; Text; numeric types such as Integer and Decimal; Boolean."
      guidance: |
        **Mandatory Rule:** Apply the same variable ordering to local procedure `var` sections and
        global variable sections.

        **Type-Group Order:**
        1. Record variables
        2. `RecordRef` and `FieldRef`
        3. Codeunit variables
        4. Enums
        5. Other complex types
        6. Code
        7. Text
        8. Numeric types such as `Integer` and `Decimal`
        9. Boolean variables

        Do not reorder existing variables solely to make an existing declaration section comply.
        When the surrounding declarations are not already ordered, place each new variable beside
        the nearest matching type group without moving unrelated declarations.

        **Example - Local Procedure:**
        ```al
        procedure ProcessDocument()
        var
            SalesHeader: Record "Sales Header";
            ItemLedgerEntry: Record "Item Ledger Entry";
            RecRef: RecordRef;
            FldRef: FieldRef;
            NoSeriesMgt: Codeunit NoSeriesManagement;
            DocumentType: Enum "Gen. Journal Document Type";
            JsonObject: JsonObject;
            DocumentNo: Code[20];
            Description: Text[100];
            LineNo: Integer;
            Amount: Decimal;
            IsHandled: Boolean;
        begin
        end;
        ```

        **Example - Global Variables:**
        ```al
        codeunit 50100 "My Processor"
        {
            var
                Customer: Record Customer;
                RecRef: RecordRef;
                MyCodeunit: Codeunit "My Helper";
                MyEnum: Enum "Email Scenario";
                JsonObject: JsonObject;
                ReferenceNo: Code[20];
                MessageText: Text[250];
                RetryCount: Integer;
                SuccessRate: Decimal;
                CanPost: Boolean;
        }
        ```
