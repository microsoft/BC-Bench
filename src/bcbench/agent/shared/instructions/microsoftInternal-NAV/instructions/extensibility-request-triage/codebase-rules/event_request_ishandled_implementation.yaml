event_request_ishandled_implementation:
  description: "Implementation rules specific to event-request/ishandled subtype"

  rules:
    - id: ishandled_initialization_required
      applies_to: ["event-request/ishandled"]
      severity: "blocking"
      description: "IsHandled parameter must be initialized to false before calling the event"
      action: "internal_warning"
      rule: "When adding a new event with IsHandled parameter or adding IsHandled parameter to an existing event, ALWAYS initialize IsHandled to false before the event call."
      guidance: |
        **Mandatory Rule:** The IsHandled parameter must ALWAYS be initialized to `false` immediately before calling an event that has an IsHandled parameter.

        **Rationale:**
        - Ensures predictable behavior - IsHandled starts as false (not handled)
        - Prevents undefined/garbage values from affecting event flow
        - Subscribers expect IsHandled to be false when they receive the event
        - Makes code intent clear - the default is to NOT skip the code block
        - Follows BC standard patterns for IsHandled events

        **Correct Pattern:**
        ```al
        var
            IsHandled: Boolean;
        begin
            IsHandled := false;
            OnBeforeSalesPost(SalesHeader, IsHandled);
            if IsHandled then
                exit;

            // Standard logic here
        end;
        ```

        **❌ Wrong - Missing initialization:**
        ```al
        var
            IsHandled: Boolean;
        begin
            // ❌ WRONG - IsHandled not initialized!
            OnBeforeSalesPost(SalesHeader, IsHandled);
            if IsHandled then
                exit;
        end;
        ```

    - id: ishandled_parameter_position_and_call_order
      applies_to: ["event-request/ishandled"]
      severity: "notice"
      description: "IsHandled placement and publisher call argument order must follow compatibility rules"
      action: "internal_warning"
      rule: "For a new event, place var IsHandled: Boolean last. When adding IsHandled and other parameters to an existing event without IsHandled, append the other parameters first and IsHandled last. If IsHandled already exists, preserve its position and append all new parameters. Publisher call arguments must exactly match the final declaration order."
      guidance: |
        **Mandatory Rules:**
        1. For a new event, place `var IsHandled: Boolean` last.
        2. When adding `IsHandled` and other parameters to an existing event that does not already
           have `IsHandled`, append the other new parameters first and append `IsHandled` last.
        3. When an existing event already has `IsHandled`, do not move it. Append additional
           parameters after the existing signature.
        4. Keep publisher call arguments in exactly the same order as the final event declaration.
        5. Do not reorder event parameters by AL type. Event signatures have no type-group ordering
           convention; preserve the existing or logical contract subject to the rules above.

        **Examples:**
        ```al
        // Existing event has no IsHandled: append PreviewMode first and IsHandled last.
        OnBeforePostSalesDocument(SalesHeader, PreviewMode, IsHandled);

        [IntegrationEvent(false, false)]
        local procedure OnBeforePostSalesDocument(var SalesHeader: Record "Sales Header"; PreviewMode: Boolean; var IsHandled: Boolean)
        begin
        end;

        // Existing event already has IsHandled: preserve its position and append PreviewMode.
        OnBeforeReleasePurchaseDocument(PurchaseHeader, IsHandled, PreviewMode);

        [IntegrationEvent(false, false)]
        local procedure OnBeforeReleasePurchaseDocument(var PurchaseHeader: Record "Purchase Header"; var IsHandled: Boolean; PreviewMode: Boolean)
        begin
        end;
        ```
