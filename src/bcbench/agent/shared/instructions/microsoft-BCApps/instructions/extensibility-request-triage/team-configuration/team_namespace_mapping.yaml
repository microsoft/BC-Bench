# Team Namespace Mapping Configuration
# Maps namespaces to team ownership for automated team assignment
# Version: 1.1
#
# Each team has an internal key (Finance / SCM / Integration) and an explicit
# `label` — the GitHub label that must be applied to the issue. Team labels are
# namespaced under "Team: ". The key and the label are NOT interchangeable:
# the Integration team's label is pluralised ("Team: Integrations"). Always emit
# the `label` value verbatim; never construct it from the team key.

team_namespace_mapping:

  Finance:
    label: "Team: Finance"
    namespaces:
      - "AccountantPortal"
      - "Bank"
      - "Booking"
      - "CashFlow"
      - "Finance.CashFlow"
      - "CostAccounting"
      - "Finance"
      - "FixedAssets"
      - "Globalization"
      - "GeneralLedger"
      - "MoneyTransfer"
      - "PaymentMethods"
      - "Payroll"
      - "PostingSetup"
      - "Sales.Peppol"
      - "SubscriptionBilling"
      - "TaxEngine"
      - "ValueAddedTax"
    match_strategy: "iterative_fallback"
    case_sensitive: false
    description: "Handles financial/accounting related code"

  SCM:
    label: "Team: SCM"
    namespaces:
      - "Assembly"
      - "CRM"
      - "HumanResources"
      - "Foundation"
      - "Inventory"
      - "Inventory.Posting"
      - "Manufacturing"
      - "Pricing"
      - "Projects"
      - "Purchases"
      - "PurchaseDocuments"
      - "Sales"
      - "Sales.Document"
      - "SalesInvoicing"
      - "Service"
      - "ServiceManagement"
      - "Warehouse"
      - "WarehouseManagement"
      - "ProductionOrders"
      - "QualityManagement"
      - "ServiceOrders"
    match_strategy: "iterative_fallback"
    case_sensitive: false
    description: "Handles supply chain, manufacturing, service, and related code"

  Integration:
    label: "Team: Integrations"
    namespaces:
      - "AI"
      - "API"
      - "Automation"
      - "Azure"
      - "AzureML"
      - "BusinessCentral"
      - "DataAdministration"
      - "DateTime"
      - "Device"
      - "Diagnostics"
      - "EMail"
      - "Email"
      - "EServices"
      - "ExternalStorage"
      - "ExternalServices"
      - "Foundation"
      - "Integration"
      - "Intercompany"
      - "JSON"
      - "REST"
      - "SOAP"
      - "Security"
      - "System"
      - "SystemApplication"
      - "Telemetry"
      - "Utilities"
      - "WebServices"
      - "XML"
    match_strategy: "iterative_fallback"
    case_sensitive: false
    description: "Handles system integration, API, automation, and utilities"

# Assignment Algorithm
assignment_algorithm:
  step1: "Extract namespaces from target objects in issue"
  step2: "Search codebase to locate actual object and determine namespace"
  step3: "Match each namespace against team namespace mappings (iterative fallback: remove Microsoft prefix, then try full, drop segment, repeat)"
  step4: "Count namespace matches per team"
  step5: "Assign team with highest match count"
  step6: "If tie, sort team keys alphabetically and select first team (Finance > Integration > SCM)"
  step7: "Emit the selected team's `label` value verbatim as TEAM_LABEL"
  step8: "If no matches found, mark as agent-not-processable"

# Tie-Breaker Rules
tie_breaker:
  enabled: true
  strategy: "alphabetical"
  order: ["Finance", "Integration", "SCM"]  # Alphabetical order, by team key
  description: "When multiple teams have equal match counts, select team appearing first alphabetically"

# Fallback Handling
fallback:
  no_objects_identified: "agent-not-processable"
  no_namespace_match: "agent-not-processable"
  single_object_multiple_namespaces: "count_all_matches"
