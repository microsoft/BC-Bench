general_alternative_suggestions:
  description: "Alternative suggestions that apply to all request types and identify a likely missing part of the requested scope"

  rules:
    - id: potentially_incomplete_request_scope
      applies_to: ["all"]
      severity: "suggestion"
      description: "The proposed scope may not fully satisfy the author's stated business or technical goal"
      action: "request_clarification"
      requires_author_confirmation: true
      warning_message: "Codebase analysis found strong evidence that a concrete part of the stated scenario may not be covered by the proposed scope."
      guidance: |
        After establishing that the requested change is feasible, challenge whether its scope completely
        supports the author's stated goal. This applies to every extensibility mechanism, including events,
        enums, access modifiers, procedures, and other extensibility changes.

        Trace only the directly relevant code needed to understand:
        - The data and state on which the proposed solution depends
        - Callers, branches, overloads, implementations, or configurations that execute the same scenario
        - Whether the extension can perform the stated operation safely and completely
        - Whether part of the same scenario bypasses the proposed solution
        - Whether the proposed change creates an incomplete or inconsistent extensibility contract

        **Strict activation criteria — ALL must be satisfied:**
        1. The missing part is directly connected to the author's stated goal.
        2. A specific code path, dependency, caller, branch, or state value demonstrates the omission.
        3. The requested solution would be incomplete, unreliable, or inconsistent without considering it.
        4. The practical effect on the author's implementation can be stated concretely.
        5. The focused addition can reasonably be handled as part of the same request.
        6. The author has not already addressed or declined the consideration in the issue body or comments.

        **Required evidence:**
        - The relevant part of the author's stated goal
        - The requested or proposed solution
        - The exact codebase finding that shows what may be missing
        - The concrete effect if the request remains unchanged

        **Do not apply this rule when:**
        - The concern is based only on similarity, symmetry, naming, or convention
        - The idea is merely a possible future improvement
        - It expands the request into a different business scenario
        - It concerns unrelated objects or processes
        - It is only a style, maintainability, or testing preference
        - The requested solution already provides a reliable way to handle the scenario
        - The evidence is ambiguous or the effect is hypothetical
        - A concrete failure or unsupported path cannot be explained

        When uncertain, do not raise the suggestion. Return at most two completeness findings for a request,
        and prefer one strong finding over multiple weaker findings.

        **Failure response requirements:**
        Set `Success` to `false` and `FailureLabel` to `missing-info`. In `FailureReason`:
        1. Restate the relevant part of the author's goal.
        2. Identify the exact object, procedure, branch, dependency, or execution path.
        3. Explain why it is part of the same scenario and the concrete effect if omitted.
        4. Suggest a focused addition or adjustment.
        5. Ask whether it should be included.
        6. Allow the author to explain why it is unnecessary.

        Use neutral language and do not state that the request is wrong.

        **Response template:**
        ```
        While analyzing the codebase for this request, we found one related part that may be needed
        to fully support the described scenario.

        **Potentially missing consideration:**
        {finding}

        **Why this may matter:**
        {concrete_effect}

        **Suggested adjustment:**
        {suggested_adjustment}

        Should this be included in the request? If it is not needed for your scenario, please explain
        why, and we will re-evaluate the request based on that information.
        ```
