repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=auto]

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.19
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ty
        name: ty check (bcbench)
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: ty-bcbench-core
        name: ty check (bcbench-core)
        # `uv check` enables ty's uv integration, which missing-direct-dependency requires
        entry: uv check --package bcbench-core --locked --no-sync --preview-features check-command
        language: system
        pass_filenames: false
